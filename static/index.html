<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarion — Deterministic Causal Reasoning Engine</title>
  <script src="./vendor/tailwind.js"></script>
  <script src="./vendor/react.js"></script>
  <script src="./vendor/react-dom.js"></script>
  <script src="./vendor/babel.js"></script>
  <style>
    /* Custom dark theme styling, projector-readable typography */
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-size: 15px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    /* Modal and Print styling */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-dossier-area, #print-dossier-area * {
        visibility: visible;
      }
      #print-dossier-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
        padding: 20px;
      }
      #print-dossier-area * {
        color: black !important;
        border-color: #ccc !important;
      }
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="min-h-screen bg-[#090d16] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function ClarionApp() {
      const [scenario, setScenario] = useState("festival_deadlock");
      const [backend, setBackend] = useState("csv");
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [robustness, setRobustness] = useState(null);
      const [phase, setPhase] = useState("idle"); // idle -> naive_alert -> streaming_trace -> verdict
      const [streamedSteps, setStreamedSteps] = useState([]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [showDossierModal, setShowDossierModal] = useState(false);
      const [dossierMarkdown, setDossierMarkdown] = useState("");
      const [dossierId, setDossierId] = useState("");

      const terminalContainerRef = useRef(null);
      const lowerSectionRef = useRef(null);
      const intervalRef = useRef(null);
      const timeoutRef = useRef(null);
      const timeoutVerdictRef = useRef(null);

      // Safe cleanup of all timers
      const clearTimers = () => {
        if (intervalRef.current) {
          clearInterval(intervalRef.current);
          intervalRef.current = null;
        }
        if (timeoutRef.current) {
          clearTimeout(timeoutRef.current);
          timeoutRef.current = null;
        }
        if (timeoutVerdictRef.current) {
          clearTimeout(timeoutVerdictRef.current);
          timeoutVerdictRef.current = null;
        }
      };

      // Cleanup on unmount
      useEffect(() => {
        return () => clearTimers();
      }, []);

      // Auto-load initial investigation on scenario or backend change
      useEffect(() => {
        handleInject(false);
        return () => clearTimers();
      }, [scenario, backend]);

      // Auto-scroll trace terminal as new steps arrive without scrolling the window
      useEffect(() => {
        if (phase === "streaming_trace" && terminalContainerRef.current) {
          terminalContainerRef.current.scrollTop = terminalContainerRef.current.scrollHeight;
        }
      }, [streamedSteps, phase]);

      // Smoothly scroll window to align top of lower section when entering trace or verdict
      useEffect(() => {
        if ((phase === "streaming_trace" || phase === "verdict") && lowerSectionRef.current) {
          lowerSectionRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }, [phase]);

      const isBusy = loading || phase === "naive_alert" || phase === "streaming_trace";

      const handleInject = async (animate = true) => {
        clearTimers();
        setLoading(true);
        try {
          const res = await fetch(`/api/investigate?scenario=${scenario}&backend=${backend}`);
          if (!res.ok) throw new Error("Investigation request failed");
          const data = await res.json();
          setResult(data);
          setDossierId(data?.dossier_id || "");

          // Fetch robustness in background
          fetch(`/api/robustness?scenario=${scenario}&backend=${backend}`)
            .then(r => r.json())
            .then(rob => setRobustness(rob))
            .catch(() => {});

          if (animate) {
            // Phase 1: naive alert for ~2.8s
            setPhase("naive_alert");
            setStreamedSteps([]);
            timeoutRef.current = setTimeout(() => {
              // Phase 2: stream agent trace step by step
              setPhase("streaming_trace");
              streamTraceSteps(data?.trace || []);
            }, 2800);
          } else {
            setStreamedSteps(data?.trace || []);
            setPhase("verdict");
          }
        } catch (err) {
          console.error("Investigation error:", err);
          setPhase("verdict");
        } finally {
          setLoading(false);
        }
      };

      const streamTraceSteps = (allSteps) => {
        clearTimers();
        if (!Array.isArray(allSteps) || allSteps.length === 0) {
          setStreamedSteps([]);
          setPhase("verdict");
          return;
        }

        let currentIdx = 0;
        intervalRef.current = setInterval(() => {
          if (currentIdx < allSteps.length) {
            const step = allSteps[currentIdx];
            if (step) {
              setStreamedSteps(prev => [...prev, step]);
            }
            currentIdx++;
          } else {
            if (intervalRef.current) {
              clearInterval(intervalRef.current);
              intervalRef.current = null;
            }
            timeoutVerdictRef.current = setTimeout(() => {
              setPhase("verdict");
            }, 400);
          }
        }, 120);
      };

      const handleOpenDossier = async () => {
        try {
          const res = await fetch(`/api/dossier?scenario=${scenario}&backend=${backend}`);
          const data = await res.json();
          setDossierMarkdown(data?.markdown || "");
          setShowDossierModal(true);
        } catch (e) {
          console.error("Dossier error:", e);
        }
      };

      const handleDownloadMd = () => {
        window.location.href = `/api/dossier.md?scenario=${scenario}&backend=${backend}`;
      };

      const handlePrint = () => {
        window.print();
      };

      if (!result) {
        return (
          <div className="flex items-center justify-center min-h-screen text-slate-400">
            <div className="text-center space-y-4">
              <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <div className="font-medium text-lg">Initializing Clarion Offline Engine...</div>
            </div>
          </div>
        );
      }

      // Safe fallbacks to prevent any null/undefined access
      const anomaly = result?.anomaly || {
        drop_pct: 0,
        baseline: 0,
        incident: 0,
        onset: "Unknown",
        window: { baseline: "18:30-18:44", incident: "18:49-21:30" },
      };

      const naive_alert = result?.naive_alert || {
        metric: "payment_502_count",
        label: "Payment Gateway 502 Surge",
        sigma: 0,
        onset: "Unknown",
        severity: "CRITICAL",
      };

      const ranked = Array.isArray(result?.ranked) ? result.ranked : [];
      const graphNodes = Array.isArray(result?.graph?.nodes) ? result.graph.nodes : [];
      const graphEdges = Array.isArray(result?.graph?.edges) ? result.graph.edges : [];
      const remediation = Array.isArray(result?.remediation) ? result.remediation : [];
      const roi = result?.roi || {
        manual_s: 16200,
        e2e_s: 90,
        reduction_pct: 99.44,
        compute_ms: 0,
        note: "",
      };

      const defaultHyp = {
        id: "H3",
        name: "Hypothesis",
        confidence: 0,
        prior: 0,
        explained_share: 0,
        recovered_pts: 0,
        verdict: "UNKNOWN",
        evidence: [],
      };

      const rootCause = ranked.find(r => r?.verdict === "ROOT_CAUSE") || ranked[0] || defaultHyp;
      const redHerring = ranked.find(r => r?.verdict === "SUPPRESSED_NOISE") || ranked[ranked.length - 1] || defaultHyp;

      // Node coordinates for SVG Causal Graph
      const sourceY = {
        audit: 75,
        telemetry: 175,
        fleet: 275,
        ledger: 375,
      };

      const roleColors = {
        root: "#ef4444",       // Red
        anomaly: "#f59e0b",    // Amber
        noise: "#64748b",      // Slate
        refutes: "#38bdf8",    // Sky
        symptom: "#eab308",    // Yellow
        operational: "#14b8a6" // Teal
      };

      const traceTotal = Math.max(1, Array.isArray(result?.trace) ? result.trace.length : 1);
      const visibleNodeCount = phase === "streaming_trace"
        ? Math.max(3, Math.min(graphNodes.length, Math.floor((streamedSteps.length / traceTotal) * graphNodes.length)))
        : graphNodes.length;

      const activeNodes = graphNodes.slice(0, visibleNodeCount);
      const activeNodeIds = new Set(activeNodes.map(n => n?.id).filter(Boolean));
      const activeEdges = graphEdges.filter(e => e?.src && e?.dst && activeNodeIds.has(e.src) && activeNodeIds.has(e.dst));

      return (
        <div className="max-w-[1720px] mx-auto p-4 md:p-6 space-y-6">
          {/* Header Bar */}
          <header className="flex flex-col xl:flex-row items-start xl:items-center justify-between gap-4 pb-4 border-b border-slate-800">
            <div>
              <div className="flex items-center gap-3">
                <span className="text-2xl font-black tracking-wider bg-gradient-to-r from-indigo-400 via-sky-300 to-emerald-400 bg-clip-text text-transparent">
                  CLARION
                </span>
                <span className="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700 font-mono">
                  v1.0-deterministic
                </span>
                <span className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-950/70 border border-emerald-800/80 text-emerald-300 text-xs font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Deterministic engine — zero hallucination — 100% offline
                </span>
              </div>
              <p className="text-slate-400 text-xs mt-1">
                Bayesian Causal Evidence Fusion &amp; Counterfactual Signal Suppression
              </p>
            </div>

            {/* Action Bar */}
            <div className="flex flex-wrap items-center gap-3 w-full xl:w-auto">
              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs">
                <span className="text-slate-400 font-medium">Scenario:</span>
                <select
                  value={scenario}
                  disabled={isBusy}
                  onChange={(e) => setScenario(e.target.value)}
                  className={`bg-transparent text-slate-200 font-semibold focus:outline-none ${isBusy ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}
                >
                  <option value="festival_deadlock" className="bg-slate-900">festival_deadlock (DB-Lock Issue)</option>
                  <option value="gateway_outage" className="bg-slate-900">gateway_outage (Gateway Crash)</option>
                </select>
              </div>

              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs">
                <span className="text-slate-400 font-medium">Backend:</span>
                <select
                  value={backend}
                  disabled={isBusy}
                  onChange={(e) => setBackend(e.target.value)}
                  className={`bg-transparent text-slate-200 font-semibold focus:outline-none ${isBusy ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}
                >
                  <option value="csv" className="bg-slate-900">CSV Micro-batch</option>
                  <option value="duckdb" className="bg-slate-900">DuckDB Pushdown</option>
                </select>
              </div>

              <button
                id="inject-btn"
                onClick={() => handleInject(true)}
                disabled={isBusy}
                className={`px-4 py-2 font-bold text-xs rounded-lg transition-all flex items-center gap-2 ${
                  isBusy
                    ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                    : 'bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white shadow-lg shadow-indigo-600/30'
                }`}
              >
                {loading ? (
                  <>
                    <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    Investigating...
                  </>
                ) : isBusy ? (
                  <>
                    <span className="w-3.5 h-3.5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></span>
                    Tracing Incident...
                  </>
                ) : (
                  <>
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    Inject Anomaly
                  </>
                )}
              </button>

              <button
                id="export-dossier-btn"
                onClick={handleOpenDossier}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs rounded-lg border border-slate-700 transition-all flex items-center gap-2"
              >
                <svg className="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Export Clarion Audit Report
              </button>
            </div>
          </header>

          {/* Phase 1 Banner: Naive Alert Flashing Notification */}
          {phase === "naive_alert" && (
            <div className="bg-red-950/80 border-2 border-red-600 rounded-xl p-5 shadow-2xl shadow-red-900/40 animate-pulse">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <span className="flex h-12 w-12 items-center justify-center rounded-xl bg-red-600/30 text-red-400 text-2xl font-black">
                    !
                  </span>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-black uppercase tracking-widest px-2 py-0.5 rounded bg-red-600 text-white">
                        NAIVE MONITORING ALERT — {naive_alert?.severity || "CRITICAL"}
                      </span>
                      <span className="text-xs text-red-300 mono font-semibold">
                        Breach Onset: {naive_alert?.onset || "Unknown"} IST
                      </span>
                    </div>
                    <h2 className="text-2xl font-extrabold text-white mt-1">
                      {naive_alert?.label} detected (+{naive_alert?.sigma}σ anomaly)
                    </h2>
                    <p className="text-xs text-red-200/90 mt-0.5">
                      Standard threshold rule fired on symptom telemetry. Engaging Clarion Causal Graph Engine...
                    </p>
                  </div>
                </div>
                <div className="text-right">
                  <span className="text-xs text-red-300 block">Symptom Deviation</span>
                  <span className="text-4xl font-black text-red-400 mono">+{naive_alert?.sigma}σ</span>
                </div>
              </div>
            </div>
          )}

          {/* Live Anomaly Banner (Always visible) */}
          <section className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-6 items-center">
              <div>
                <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold block">Incident Status</span>
                <div className="flex items-center gap-2 mt-1">
                  <span className={`w-3 h-3 rounded-full ${phase === 'verdict' ? 'bg-emerald-500' : 'bg-amber-500 animate-ping'}`}></span>
                  <span className="text-base font-bold text-white uppercase tracking-wide">
                    {phase === 'verdict' ? 'CAUSAL VERDICT REACHED' : 'ANOMALY UNDER TRACE'}
                  </span>
                </div>
                <span className="text-xs text-slate-400 mono block mt-1">
                  Hub: South Bengaluru (BLR-S)
                </span>
              </div>

              <div>
                <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold block">Completion Rate Drop</span>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="text-3xl font-black text-rose-400 mono">-{anomaly?.drop_pct}%</span>
                  <span className="text-xs text-slate-400">during incident window</span>
                </div>
              </div>

              <div>
                <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold block">KPI Baseline → Incident</span>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="text-xl font-bold text-slate-300 mono">
                    {((anomaly?.baseline ?? 0) * 100).toFixed(1)}% → {((anomaly?.incident ?? 0) * 100).toFixed(1)}%
                  </span>
                </div>
                <span className="text-xs text-slate-400 block mt-0.5">
                  Eval Window: {anomaly?.window?.incident || "19:00-21:00"} IST
                </span>
              </div>

              <div className="border-l border-slate-800 pl-4">
                <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold block">Anomaly Onset</span>
                <div className="text-lg font-bold text-amber-300 mono mt-1">
                  {anomaly?.onset} IST
                </div>
                <span className="text-xs text-slate-400 block mt-0.5">
                  Baseline window: {anomaly?.window?.baseline || "18:30-18:44"}
                </span>
              </div>
            </div>
          </section>

          {/* Split View: Red Herring vs True Root Cause */}
          <section className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Red Herring Box */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs uppercase font-bold tracking-widest text-slate-400">
                    Symptom / Red Herring Signal
                  </span>
                  <span className="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-slate-800 text-slate-300 border border-slate-700">
                    {redHerring?.verdict || "SUPPRESSED_NOISE"}
                  </span>
                </div>

                <div className="flex items-baseline justify-between mb-4">
                  <h3 className="text-2xl font-black text-slate-200">
                    {redHerring?.name || "Red Herring"}
                  </h3>
                  <div className="text-right">
                    <span className="text-xs text-slate-400 block">Posterior Confidence</span>
                    <span className="text-3xl font-black text-slate-400 mono">
                      {((redHerring?.confidence ?? 0) * 100).toFixed(1)}%
                    </span>
                  </div>
                </div>

                {/* Counterfactual Isolation Box */}
                <div className="bg-slate-950/70 border border-slate-800 rounded-lg p-3.5 mb-4 text-xs space-y-1.5">
                  <div className="flex justify-between items-center text-slate-300 font-semibold">
                    <span>Counterfactual Cancellation Share:</span>
                    <span className="mono text-indigo-300 font-bold">{((redHerring?.explained_share ?? 0) * 100).toFixed(1)}%</span>
                  </div>
                  <div className="flex justify-between items-center text-slate-300 font-semibold">
                    <span>Recovered Impact Points:</span>
                    <span className="mono text-indigo-300 font-bold">{(redHerring?.recovered_pts ?? 0).toFixed(2)} pts</span>
                  </div>
                  <p className="text-[11px] text-slate-400 pt-1 border-t border-slate-800/80">
                    {redHerring?.id === "H1"
                      ? "Suppression verified: 502 errors occurred downstream of client timeouts with 98.6% banking capture success."
                      : "Suppression verified: signal share is statistically negligible compared to primary driver."}
                  </p>
                </div>

                {/* Evidence Trail */}
                <div className="space-y-2">
                  <span className="text-xs uppercase font-semibold tracking-wider text-slate-400 block">
                    Evidence Verification Trail
                  </span>
                  {(redHerring?.evidence || []).map(ev => (
                    <div key={ev?.id || Math.random()} className="bg-slate-950/50 border border-slate-800/60 rounded p-2.5 flex items-center justify-between text-xs gap-3">
                      <div>
                        <span className="font-mono text-[10px] text-slate-400 mr-2">{ev?.id}</span>
                        <span className="text-slate-300">{ev?.text}</span>
                      </div>
                      <span className={`font-mono font-bold px-2 py-0.5 rounded text-[11px] whitespace-nowrap ${(ev?.lr ?? 1) < 1.0 ? 'bg-rose-950 text-rose-300 border border-rose-900' : 'bg-slate-800 text-slate-300'}`}>
                        LR {(ev?.lr ?? 1).toFixed(3)}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* True Root Cause Box */}
            <div className="bg-indigo-950/20 border-2 border-indigo-500/80 rounded-xl p-5 flex flex-col justify-between shadow-xl shadow-indigo-950/30">
              <div>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs uppercase font-bold tracking-widest text-indigo-300 flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    Identified Root Cause
                  </span>
                  <span className="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-emerald-900/80 text-emerald-300 border border-emerald-600">
                    {rootCause?.verdict || "ROOT_CAUSE"}
                  </span>
                </div>

                <div className="flex items-baseline justify-between mb-4">
                  <h3 className="text-2xl font-black text-white">
                    {rootCause?.name || "Root Cause"}
                  </h3>
                  <div className="text-right">
                    <span className="text-xs text-indigo-200 block">Posterior Confidence</span>
                    <span className="text-4xl font-black text-emerald-400 mono">
                      {((rootCause?.confidence ?? 0) * 100).toFixed(1)}%
                    </span>
                  </div>
                </div>

                {/* Counterfactual Isolation Box */}
                <div className="bg-slate-950/80 border border-indigo-900/60 rounded-lg p-3.5 mb-4 text-xs space-y-1.5">
                  <div className="flex justify-between items-center text-slate-200 font-semibold">
                    <span>Counterfactual Failure Share:</span>
                    <span className="mono text-emerald-400 font-bold">{((rootCause?.explained_share ?? 0) * 100).toFixed(1)}%</span>
                  </div>
                  <div className="flex justify-between items-center text-slate-200 font-semibold">
                    <span>Recovered Drop Points:</span>
                    <span className="mono text-emerald-400 font-bold">{(rootCause?.recovered_pts ?? 0).toFixed(2)} pts</span>
                  </div>
                  <p className="text-[11px] text-slate-400 pt-1 border-t border-slate-800">
                    Counterfactual simulation confirms that mitigating this cause recovers {(rootCause?.recovered_pts ?? 0).toFixed(1)} percentage points of completion rate drop.
                  </p>
                </div>

                {/* Evidence Trail */}
                <div className="space-y-2">
                  <span className="text-xs uppercase font-semibold tracking-wider text-indigo-300 block">
                    Evidence Verification Trail
                  </span>
                  {(rootCause?.evidence || []).map(ev => (
                    <div key={ev?.id || Math.random()} className="bg-slate-950/60 border border-slate-800 rounded p-2.5 flex items-center justify-between text-xs gap-3">
                      <div>
                        <span className="font-mono text-[10px] text-indigo-400 mr-2">{ev?.id}</span>
                        <span className="text-slate-200">{ev?.text}</span>
                      </div>
                      <span className={`font-mono font-bold px-2 py-0.5 rounded text-[11px] whitespace-nowrap ${(ev?.lr ?? 1) >= 1.5 ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-slate-800 text-slate-300'}`}>
                        LR {(ev?.lr ?? 1).toFixed(3)}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* Interactive Causal Graph (SVG with Lanes) */}
          <section className="bg-slate-900/90 border border-slate-800 rounded-xl p-5">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-4 border-b border-slate-800 gap-3">
              <div>
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <span>Deterministic Causal Evidence Graph</span>
                  <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 mono">
                    {activeNodes.length} nodes / {activeEdges.length} edges
                  </span>
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">
                  Multi-modal evidence topology with strict temporal ordering. Click any node to inspect raw audit details.
                </p>
              </div>

              {/* Graph Legend */}
              <div className="flex flex-wrap items-center gap-3 text-xs">
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-red-500"></span>Root Cause</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>Anomaly</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-500"></span>Noise</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-sky-400"></span>Refutes</span>
                <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>Symptom</span>
              </div>
            </div>

            {/* SVG Graph Canvas */}
            <div className="relative overflow-x-auto pt-4">
              <svg className="w-full min-w-[1000px] h-[460px] bg-[#070b12] rounded-lg border border-slate-950" viewBox="0 0 1100 450">
                <defs>
                  <marker id="arrow-causes" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
                  </marker>
                  <marker id="arrow-triggers" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#eab308" />
                  </marker>
                  <marker id="arrow-refutes" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
                  </marker>
                  <marker id="arrow-amplifies" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
                  </marker>
                </defs>

                {/* Source Lanes Background & Labels */}
                {Object.entries({
                  audit: { y: 20, h: 90, label: "Audit Log (Configuration & DB Deadlocks)" },
                  telemetry: { y: 110, h: 110, label: "Telemetry Time-Series (Metrics & Queues)" },
                  fleet: { y: 220, h: 100, label: "Fleet Logistics (Pickers & Riders)" },
                  ledger: { y: 320, h: 110, label: "Payment Ledger (Bank Capture & Cancellations)" }
                }).map(([k, lane]) => (
                  <g key={k}>
                    <rect x="0" y={lane.y} width="1100" height={lane.h} fill="#0d131f" stroke="#172033" strokeWidth="1" />
                    <text x="16" y={lane.y + 22} fill="#64748b" fontSize="11" fontWeight="700" letterSpacing="0.05em" textTransform="uppercase">
                      {lane.label}
                    </text>
                  </g>
                ))}

                {/* Edges */}
                {activeEdges.map((edge, idx) => {
                  const srcNode = activeNodes.find(n => n?.id === edge.src);
                  const dstNode = activeNodes.find(n => n?.id === edge.dst);
                  if (!srcNode || !dstNode) return null;

                  const srcX = getNodeX(srcNode.id);
                  const srcY = sourceY[srcNode.source] || 200;
                  const dstX = getNodeX(dstNode.id);
                  const dstY = sourceY[dstNode.source] || 200;

                  const isDashed = edge.type !== "causes";
                  const edgeColor = edge.type === "causes" ? "#ef4444" : edge.type === "refutes" ? "#38bdf8" : edge.type === "amplifies" ? "#a855f7" : "#eab308";

                  return (
                    <line
                      key={`edge-${idx}`}
                      x1={srcX}
                      y1={srcY}
                      x2={dstX}
                      y2={dstY}
                      stroke={edgeColor}
                      strokeWidth="2"
                      strokeDasharray={isDashed ? "4,4" : "none"}
                      markerEnd={`url(#arrow-${edge.type})`}
                      opacity="0.85"
                    />
                  );
                })}

                {/* Nodes */}
                {activeNodes.map((node) => {
                  if (!node) return null;
                  const x = getNodeX(node.id);
                  const y = sourceY[node.source] || 200;
                  const color = roleColors[node.role] || "#94a3b8";
                  const isSelected = selectedNode?.id === node.id;

                  return (
                    <g
                      key={node.id}
                      onClick={() => setSelectedNode(node)}
                      className="cursor-pointer group"
                    >
                      <circle
                        cx={x}
                        cy={y}
                        r={isSelected ? 14 : 10}
                        fill={color}
                        stroke={isSelected ? "#ffffff" : "#0f172a"}
                        strokeWidth={isSelected ? 4 : 3}
                        style={{ transformOrigin: "center", transformBox: "fill-box" }}
                        className="transition-all duration-150 group-hover:stroke-white group-hover:stroke-[4px]"
                      />
                      <rect
                        x={x - 85}
                        y={y + 14}
                        width="170"
                        height="26"
                        rx="4"
                        fill="#0b111e"
                        stroke={isSelected ? color : "#1e293b"}
                        strokeWidth="1"
                        opacity="0.95"
                      />
                      <text
                        x={x}
                        y={y + 31}
                        fill="#e2e8f0"
                        fontSize="10"
                        fontWeight="600"
                        textAnchor="middle"
                        className="select-none pointer-events-none"
                      >
                        {truncateText(node.label || "", 26)}
                      </text>
                    </g>
                  );
                })}
              </svg>

              {/* Selected Node Inspector Flyout */}
              {selectedNode && (
                <div className="mt-3 p-4 bg-slate-950 border border-slate-700 rounded-lg text-xs flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="font-bold text-white text-sm">{selectedNode?.label}</span>
                      <span className="px-2 py-0.5 rounded text-[10px] uppercase font-bold mono bg-slate-800 text-slate-300">
                        Role: {selectedNode?.role}
                      </span>
                      <span className="text-slate-400 mono">Source: {selectedNode?.source}</span>
                    </div>
                    <p className="text-slate-300">{selectedNode?.detail}</p>
                    <span className="text-[11px] text-slate-400 mono block mt-0.5">
                      Entity: {selectedNode?.entity} | Recorded: {selectedNode?.ts}
                    </span>
                  </div>
                  <button
                    onClick={() => setSelectedNode(null)}
                    className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-semibold"
                  >
                    Close Inspector
                  </button>
                </div>
              )}
            </div>
          </section>

          {/* Lower Grid: Agent Trace Terminal, Ranked Causes, Remediation, Velocity Index */}
          <div ref={lowerSectionRef} className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Agent Trace Terminal (Left 7 Cols) */}
            <div className="lg:col-span-7 bg-[#060a12] border border-slate-800 rounded-xl p-5 flex flex-col h-[520px]">
              <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-rose-500"></span>
                  <span className="w-3 h-3 rounded-full bg-amber-500"></span>
                  <span className="w-3 h-3 rounded-full bg-emerald-500"></span>
                  <span className="text-xs font-bold text-slate-300 mono ml-2">
                    Agentic Reasoning Execution Trace ({streamedSteps.length}/{Array.isArray(result?.trace) ? result.trace.length : 0} checks)
                  </span>
                </div>
                <span className="text-[11px] text-slate-400 mono">
                  Playbook execution live
                </span>
              </div>

              <div ref={terminalContainerRef} className="flex-1 overflow-y-auto space-y-2 mono text-xs pr-1">
                {streamedSteps.filter(Boolean).map((step, idx) => {
                  const stepNum = step?.step ?? (idx + 1);
                  const stepHyp = step?.hypothesis ?? "H3";
                  const hypColor = stepHyp === "H3" ? "text-emerald-400" : stepHyp === "H2" ? "text-cyan-400" : "text-amber-400";
                  return (
                    <div key={stepNum} className="p-2 rounded bg-slate-950/70 border border-slate-900 leading-relaxed">
                      <div className="flex items-center justify-between text-[11px] mb-1">
                        <span className="text-slate-400">
                          Step [{stepNum.toString().padStart(2, "0")}] → <span className={`font-bold ${hypColor}`}>{stepHyp}</span>
                        </span>
                        <span className="text-indigo-400 font-semibold">{step?.tool || "tool"}()</span>
                      </div>
                      <div className="text-slate-400 text-[11px]">
                        query: <span className="text-slate-300">{JSON.stringify(step?.query || {})}</span>
                      </div>
                      <div className="text-slate-200 mt-1 pl-2 border-l-2 border-slate-700">
                        {step?.result || ""}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Right Column: Ranked Causes, Remediation, Velocity Index (5 Cols) */}
            <div className="lg:col-span-5 space-y-6">
              {/* Ranked Causes */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5">
                <h4 className="text-sm font-bold text-white uppercase tracking-wider mb-3">
                  Ranked Probable Root Causes
                </h4>
                <div className="space-y-3">
                  {ranked.map((item, idx) => {
                    if (!item) return null;
                    return (
                      <div key={item.id || idx} className="p-3 bg-slate-950/80 border border-slate-800/80 rounded-lg">
                        <div className="flex items-center justify-between mb-1">
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-white text-xs">#{idx + 1} {item.name}</span>
                            <span className="text-[10px] mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">
                              {item.id}
                            </span>
                          </div>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${
                            item.verdict === 'ROOT_CAUSE' ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' :
                            item.verdict === 'SUPPRESSED_NOISE' ? 'bg-slate-800 text-slate-400 border border-slate-700' :
                            'bg-indigo-950 text-indigo-300 border border-indigo-700'
                          }`}>
                            {item.verdict}
                          </span>
                        </div>
                        {/* Progress Bar */}
                        <div className="w-full bg-slate-800 rounded-full h-2 my-2 overflow-hidden">
                          <div
                            className={`h-full rounded-full transition-all duration-500 ${
                              item.verdict === 'ROOT_CAUSE' ? 'bg-emerald-500' :
                              item.verdict === 'SUPPRESSED_NOISE' ? 'bg-slate-600' : 'bg-indigo-500'
                            }`}
                            style={{ width: `${Math.round((item.confidence ?? 0) * 100)}%` }}
                          ></div>
                        </div>
                        <div className="flex justify-between items-center text-[11px] text-slate-400 mono">
                          <span>Prior: {((item.prior ?? 0) * 100).toFixed(0)}%</span>
                          <span className="font-bold text-white">Posterior: {((item.confidence ?? 0) * 100).toFixed(1)}%</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Remediation List */}
              <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5">
                <h4 className="text-sm font-bold text-white uppercase tracking-wider mb-2 flex items-center justify-between">
                  <span>Advisory Remediation Plan</span>
                  <span className="text-[10px] text-amber-400 font-semibold px-2 py-0.5 bg-amber-950/60 border border-amber-800 rounded">
                    Human Approval Required
                  </span>
                </h4>
                <div className="space-y-2 mt-3">
                  {remediation.map((rem, idx) => {
                    if (!rem) return null;
                    return (
                      <div key={rem.priority || idx} className="p-2.5 bg-slate-950/60 border border-slate-800 rounded text-xs space-y-1">
                        <div className="font-semibold text-slate-200">
                          {rem.priority}. {rem.action}
                        </div>
                        <div className="mono text-[11px] text-indigo-300">
                          Target: {rem.target}
                        </div>
                        <div className="text-[10px] text-slate-400 italic">
                          {rem.advisory}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Investigation Velocity Index Card */}
              <div className="bg-gradient-to-br from-indigo-950/40 to-slate-900 border border-indigo-900/50 rounded-xl p-5">
                <span className="text-xs font-bold text-indigo-300 uppercase tracking-wider block mb-2">
                  Investigation Velocity Index
                </span>
                <div className="grid grid-cols-2 gap-4 my-2">
                  <div>
                    <span className="text-[11px] text-slate-400 block">Manual MTTR</span>
                    <span className="text-2xl font-black text-slate-300 mono">4.5 h</span>
                    <span className="text-[10px] text-slate-400 block">({roi?.manual_s || 16200}s benchmark)</span>
                  </div>
                  <div>
                    <span className="text-[11px] text-slate-400 block">Clarion E2E</span>
                    <span className="text-2xl font-black text-emerald-400 mono">90 s</span>
                    <span className="text-[10px] text-slate-400 block">({roi?.reduction_pct || 99.44}% MTTR reduction)</span>
                  </div>
                </div>
                <div className="text-[11px] text-slate-400 pt-2 border-t border-slate-800/80">
                  both MTTR figures are assumptions from config.json; measured compute time: <span className="text-white font-bold mono">{roi?.compute_ms || 0} ms</span>
                </div>
              </div>

              {/* Robustness Mini-Panel */}
              {robustness && (
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 text-xs">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-bold text-slate-300 uppercase tracking-wider text-[11px]">
                      Monte Carlo Ranking Stability
                    </span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-300 border border-emerald-800">
                      {((robustness.share_top_cause_holds ?? 0) * 100).toFixed(1)}% Stable
                    </span>
                  </div>
                  <p className="text-slate-400 text-[11px]">
                    Top root cause held in <strong className="text-white mono">{((robustness.share_top_cause_holds ?? 0) * 100).toFixed(1)}%</strong> of {(robustness.n_runs || 5000).toLocaleString()} runs under uniform ±30% prior &amp; likelihood ratio perturbations (acceptance threshold: ≥ 95%).
                  </p>
                </div>
              )}
            </div>
          </div>

          {/* Dossier Modal */}
          {showDossierModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl">
                {/* Modal Header */}
                <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-white text-base">
                      Clarion Auditable Incident Dossier
                    </h3>
                    <span className="text-xs text-slate-400 mono">
                      Dossier ID: {dossierId} | SHA-256 Verified
                    </span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handlePrint}
                      className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700"
                    >
                      Print / Save PDF
                    </button>
                    <button
                      onClick={handleDownloadMd}
                      className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow"
                    >
                      Download .md
                    </button>
                    <button
                      onClick={() => setShowDossierModal(false)}
                      className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs font-semibold rounded-lg"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Printable / Renderable Content */}
                <div id="print-dossier-area" className="p-6 overflow-y-auto font-mono text-xs text-slate-200 whitespace-pre-wrap leading-relaxed select-text">
                  {dossierMarkdown}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function getNodeX(nodeId) {
      const xMap = {
        node_config_search: 120,
        node_config_batching: 160,
        node_deadlock_audit: 290,
        node_no_deadlocks: 290,
        node_db_locks: 300,
        node_alloc_latency: 420,
        node_picker_idle: 430,
        node_dispatch_queue: 560,
        node_anomaly_completion: 680,
        node_dispatch_timeouts: 700,
        node_payment_502: 840,
        node_upi_capture: 860,
        node_poll_timing: 980,
        node_weather_rejection: 990,
      };
      return xMap[nodeId] || 500;
    }

    function truncateText(str, max) {
      if (!str) return "";
      return str.length > max ? str.slice(0, max - 2) + ".." : str;
    }

    const rootElement = document.getElementById("root");
    const reactRoot = ReactDOM.createRoot(rootElement);
    reactRoot.render(<ClarionApp />);
  </script>
</body>
</html>
