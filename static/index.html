<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarion — Deterministic Causal Reasoning Engine</title>
  <script src="./vendor/tailwind.js"></script>
  <script src="./vendor/react.js"></script>
  <script src="./vendor/react-dom.js"></script>
  <script src="./vendor/babel.js"></script>
  <style>
    body {
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      transition: background 0.35s ease, color 0.25s ease;
      min-height: 100vh;
      background-attachment: fixed !important;
    }

    /* Ambient Diminishing Mesh Gradients */
    body.theme-dark {
      background:
        radial-gradient(circle at 10% 8%, rgba(99, 102, 241, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 90% 12%, rgba(6, 182, 212, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.20) 0%, transparent 48%),
        radial-gradient(circle at 12% 88%, rgba(168, 85, 247, 0.18) 0%, transparent 45%),
        linear-gradient(135deg, #060814 0%, #0c1126 30%, #071220 65%, #030b14 100%);
      color: #f1f5f9;
    }

    body.theme-light {
      background:
        radial-gradient(circle at 10% 8%, rgba(129, 140, 248, 0.30) 0%, transparent 50%),
        radial-gradient(circle at 90% 12%, rgba(56, 189, 248, 0.26) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(52, 211, 153, 0.26) 0%, transparent 50%),
        radial-gradient(circle at 12% 88%, rgba(232, 121, 249, 0.20) 0%, transparent 45%),
        linear-gradient(135deg, #eef2ff 0%, #f1f5f9 35%, #e0f2fe 70%, #ecfdf5 100%);
      color: #0f172a;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .glass-card {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      box-shadow: 0 12px 36px -8px rgba(6, 182, 212, 0.18);
      transform: translateY(-2px);
    }

    .floating-pill {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .floating-pill:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 20px -4px rgba(99, 102, 241, 0.35);
    }

    @keyframes flowPulse {
      from {
        stroke-dashoffset: 28;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    .animate-causal-flow {
      stroke-dasharray: 7, 7;
      animation: flowPulse 1.2s linear infinite;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #print-dossier-area,
      #print-dossier-area * {
        visibility: visible;
      }

      #print-dossier-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
        padding: 24px;
      }
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.45);
    }
  </style>
</head>

<body class="theme-dark antialiased selection:bg-cyan-400 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // High-Resolution 1-Second Parametric Causal Engine
    // Timeline window: 18:30:00 (0s) to 19:30:00 (3600s)
    function calculateTelemetryAtSecond(sec) {
      const clampedSec = Math.max(0, Math.min(3600, sec));

      // Time format
      const baseMinutes = 30 + Math.floor(clampedSec / 60);
      const hour = 18 + Math.floor(baseMinutes / 60);
      const minute = baseMinutes % 60;
      const second = clampedSec % 60;
      const timeStr = `${hour}:${minute.toString().padStart(2, "0")}:${second.toString().padStart(2, "0")}`;

      // Deterministic smooth micro-jitter
      const jitter = Math.sin(clampedSec * 0.45) * 0.15;
      const jitterLock = Math.cos(clampedSec * 0.3) * 6;

      let kpi = 94.6 + jitter;
      let lock = 14 + jitterLock;
      let upi = 98.9;
      let p502 = 1;
      let statusTag = "NORMAL BASELINE";

      if (clampedSec < 900) {
        kpi = 94.6 + jitter;
        lock = 14 + jitterLock;
        p502 = Math.max(0, Math.round(1 + Math.sin(clampedSec * 0.2)));
      } else if (clampedSec < 1080) {
        const prog = (clampedSec - 900) / 180;
        kpi = 94.6 - prog * 2.2 + jitter;
        lock = 14 + Math.pow(prog, 2) * 496 + jitterLock;
        statusTag = "FLAG ACTIVATED (18:45)";
      } else if (clampedSec < 1140) {
        const prog = (clampedSec - 1080) / 60;
        kpi = 92.4 - prog * 11.1 + jitter;
        lock = 510 + Math.pow(prog, 1.8) * 810 + jitterLock;
        p502 = Math.round(3 + prog * 6);
        statusTag = "DB LOCK SURGE (18:48)";
      } else if (clampedSec < 1200) {
        const prog = (clampedSec - 1140) / 60;
        kpi = 81.3 - prog * 7.3 + jitter;
        lock = 1320 + prog * 570 + jitterLock;
        p502 = Math.round(9 + Math.pow(prog, 2) * 39);
        statusTag = "BREACH ONSET (18:49)";
      } else if (clampedSec < 1500) {
        const prog = (clampedSec - 1200) / 300;
        kpi = 74.0 - prog * 5.5 + jitter;
        lock = 1890 + prog * 530 + jitterLock;
        p502 = Math.round(48 + prog * 94);
        statusTag = "502 SYMPTOM ALARM (18:50)";
      } else {
        const prog = Math.min(1.0, (clampedSec - 1500) / 2100);
        kpi = 68.5 - prog * 0.8 + jitter;
        lock = 2420 + prog * 270 + jitterLock;
        p502 = Math.round(142 + prog * 360);
        statusTag = "INCIDENT PLATEAU";
      }

      return {
        sec: clampedSec,
        timeStr,
        kpi: Math.max(55, Math.min(100, kpi)).toFixed(2),
        lock: Math.max(5, Math.round(lock)),
        upi: (upi + Math.sin(clampedSec * 0.1) * 0.1).toFixed(1),
        p502: Math.max(0, p502),
        statusTag
      };
    }

    function TemporalTimeSeriesChart({ isDark }) {
      const [currentSec, setCurrentSec] = useState(1140);
      const [isHovering, setIsHovering] = useState(false);
      const [showKpi, setShowKpi] = useState(true);
      const [showLock, setShowLock] = useState(true);

      const width = 1000;
      const height = 220;
      const padLeft = 45;
      const padRight = 55;
      const padTop = 22;
      const padBottom = 30;

      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const getX = (sec) => padLeft + (sec / 3600) * plotW;
      const getY_kpi = (val) => padTop + plotH - ((val - 60) / 40) * plotH;
      const getY_lock = (val) => padTop + plotH - (val / 3000) * plotH;

      const curveSamples = useMemo(() => {
        const samples = [];
        for (let s = 0; s <= 3600; s += 50) {
          const t = calculateTelemetryAtSecond(s);
          samples.push({
            x: getX(s),
            y_kpi: getY_kpi(parseFloat(t.kpi)),
            y_lock: getY_lock(t.lock)
          });
        }
        return samples;
      }, []);

      const kpiPath = useMemo(() => {
        return curveSamples.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y_kpi.toFixed(1)}`).join(" ");
      }, [curveSamples]);

      const lockPath = useMemo(() => {
        return curveSamples.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y_lock.toFixed(1)}`).join(" ");
      }, [curveSamples]);

      const kpiArea = `${kpiPath} L ${getX(3600)} ${padTop + plotH} L ${padLeft} ${padTop + plotH} Z`;

      const liveMetrics = useMemo(() => calculateTelemetryAtSecond(currentSec), [currentSec]);
      const scrubberX = getX(currentSec);

      return (
        <section className={`border rounded-2xl p-5 md:p-6 glass-card relative overflow-hidden ${isDark ? 'bg-slate-900/70 border-slate-700/60 shadow-2xl' : 'bg-white/85 border-slate-200/90 shadow-xl'
          }`}>
          <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-cyan-400 via-indigo-500 to-amber-400 opacity-80"></div>

          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-3 border-b border-slate-800/70">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-sm font-black tracking-tight text-white flex items-center gap-2">
                  <span>📈 Causal Telemetry Stream</span>
                </span>
                <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                  1-Second Granular Pushdown
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-0.5">
                Scrub cursor anywhere to inspect second-by-second causal divergence across micro-batches.
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2 text-xs font-mono">
              <button
                onClick={() => setShowKpi(!showKpi)}
                className={`px-3 py-1.5 rounded-xl border font-semibold flex items-center gap-2 transition floating-pill cursor-pointer ${showKpi ? 'bg-cyan-950/80 text-cyan-300 border-cyan-500/50 shadow-lg shadow-cyan-950/40' : 'bg-slate-800/40 text-slate-500 border-slate-700 opacity-60'
                  }`}
              >
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span>Completion:</span>
                <span className="font-bold text-cyan-300">{liveMetrics.kpi}%</span>
              </button>

              <button
                onClick={() => setShowLock(!showLock)}
                className={`px-3 py-1.5 rounded-xl border font-semibold flex items-center gap-2 transition floating-pill cursor-pointer ${showLock ? 'bg-amber-950/80 text-amber-300 border-amber-500/50 shadow-lg shadow-amber-950/40' : 'bg-slate-800/40 text-slate-500 border-slate-700 opacity-60'
                  }`}
              >
                <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                <span>DB Lock Wait:</span>
                <span className="font-bold text-amber-300">{liveMetrics.lock}ms</span>
              </button>

              <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 font-bold text-xs">
                <span className="text-slate-400">T:</span>
                <span className="text-cyan-400">{liveMetrics.timeStr} IST</span>
              </div>
            </div>
          </div>

          <div className="relative pt-3 overflow-x-auto">
            <svg
              className={`w-full min-w-[920px] h-[220px] rounded-xl select-none cursor-crosshair transition-colors ${isDark ? 'bg-[#050812]/90 border border-slate-800/70' : 'bg-slate-50/95 border border-slate-200'
                }`}
              viewBox={`0 0 ${width} ${height}`}
              onMouseMove={(e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const mouseX = ((e.clientX - rect.left) / rect.width) * width;
                const relX = Math.max(padLeft, Math.min(width - padRight, mouseX));
                const fraction = (relX - padLeft) / plotW;
                setCurrentSec(Math.round(fraction * 3600));
                setIsHovering(true);
              }}
              onMouseLeave={() => setIsHovering(false)}
            >
              <defs>
                <linearGradient id="glowKpiGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#06b6d4" stopOpacity="0.30" />
                  <stop offset="100%" stopColor="#06b6d4" stopOpacity="0.0" />
                </linearGradient>
                <filter id="glow-cursor" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="4" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

              <rect
                x={padLeft}
                y={padTop}
                width={getX(900) - padLeft}
                height={plotH}
                fill={isDark ? "rgba(16, 185, 129, 0.05)" : "rgba(16, 185, 129, 0.12)"}
              />
              <text x={padLeft + 8} y={padTop + 14} fill="#10b981" fontSize="9" fontFamily="ui-monospace, monospace" fontWeight="700">
                BASELINE HEALTH WINDOW (94.6%)
              </text>

              {[70, 80, 90].map(v => (
                <g key={v}>
                  <line
                    x1={padLeft}
                    y1={getY_kpi(v)}
                    x2={width - padRight}
                    y2={getY_kpi(v)}
                    stroke={isDark ? "rgba(51, 65, 85, 0.35)" : "rgba(203, 213, 225, 0.7)"}
                    strokeDasharray="4,4"
                  />
                  <text
                    x={padLeft - 6}
                    y={getY_kpi(v) + 3}
                    fill={isDark ? "#64748b" : "#94a3b8"}
                    fontSize="9"
                    fontFamily="ui-monospace, monospace"
                    textAnchor="end"
                  >
                    {v}%
                  </text>
                </g>
              ))}

              {[1000, 2500].map(v => (
                <text
                  key={v}
                  x={width - padRight + 6}
                  y={getY_lock(v) + 3}
                  fill={isDark ? "#d97706" : "#b45309"}
                  fontSize="9"
                  fontFamily="ui-monospace, monospace"
                  textAnchor="start"
                >
                  {v}ms
                </text>
              ))}

              <line
                x1={getX(1140)}
                y1={padTop}
                x2={getX(1140)}
                y2={padTop + plotH}
                stroke="#ef4444"
                strokeWidth="1.5"
                strokeDasharray="3,3"
                opacity="0.75"
              />

              {showKpi && (
                <path d={kpiArea} fill="url(#glowKpiGrad)" />
              )}

              {showLock && (
                <path
                  d={lockPath}
                  fill="none"
                  stroke="#f59e0b"
                  strokeWidth="2.5"
                  strokeLinecap="round"
                />
              )}

              {showKpi && (
                <path
                  d={kpiPath}
                  fill="none"
                  stroke="#06b6d4"
                  strokeWidth="3"
                  strokeLinecap="round"
                />
              )}

              {[0, 600, 1200, 1800, 2400, 3000, 3600].map(s => {
                const min = 30 + (s / 60);
                const h = 18 + Math.floor(min / 60);
                const m = (min % 60).toString().padStart(2, "0");
                return (
                  <text
                    key={s}
                    x={getX(s)}
                    y={padTop + plotH + 18}
                    fill={isDark ? "#64748b" : "#94a3b8"}
                    fontSize="9"
                    fontFamily="ui-monospace, monospace"
                    textAnchor="middle"
                  >
                    {`${h}:${m}`}
                  </text>
                );
              })}

              <line
                x1={scrubberX}
                y1={padTop}
                x2={scrubberX}
                y2={padTop + plotH}
                stroke="#38bdf8"
                strokeWidth="2"
                filter="url(#glow-cursor)"
              />

              {showKpi && (
                <circle
                  cx={scrubberX}
                  cy={getY_kpi(parseFloat(liveMetrics.kpi))}
                  r="5"
                  fill="#06b6d4"
                  stroke="#ffffff"
                  strokeWidth="2"
                />
              )}
              {showLock && (
                <circle
                  cx={scrubberX}
                  cy={getY_lock(liveMetrics.lock)}
                  r="5"
                  fill="#f59e0b"
                  stroke="#ffffff"
                  strokeWidth="2"
                />
              )}
            </svg>
          </div>

          <div className="mt-4 pt-3 border-t border-slate-800/80 grid grid-cols-2 md:grid-cols-4 gap-2.5">
            <button
              onClick={() => setCurrentSec(900)}
              className={`p-2.5 rounded-xl border text-left transition floating-pill cursor-pointer ${currentSec >= 900 && currentSec < 1080 ? 'bg-indigo-950/90 border-indigo-500/70 shadow-lg shadow-indigo-950/50' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                }`}
            >
              <div className="flex items-center gap-2">
                <span className="w-5 h-5 rounded-md bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-[10px] font-mono">1</span>
                <div>
                  <span className="text-[10px] font-mono text-slate-400 block">18:45:00 IST</span>
                  <span className="text-slate-200 font-bold text-xs">Flag Toggled</span>
                </div>
              </div>
            </button>

            <button
              onClick={() => setCurrentSec(1080)}
              className={`p-2.5 rounded-xl border text-left transition floating-pill cursor-pointer ${currentSec >= 1080 && currentSec < 1140 ? 'bg-amber-950/90 border-amber-500/70 shadow-lg shadow-amber-950/50' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                }`}
            >
              <div className="flex items-center gap-2">
                <span className="w-5 h-5 rounded-md bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-[10px] font-mono">2</span>
                <div>
                  <span className="text-[10px] font-mono text-slate-400 block">18:48:00 IST</span>
                  <span className="text-amber-300 font-bold text-xs">DB Lock Spikes</span>
                </div>
              </div>
            </button>

            <button
              onClick={() => setCurrentSec(1140)}
              className={`p-2.5 rounded-xl border text-left transition floating-pill cursor-pointer ${currentSec >= 1140 && currentSec < 1200 ? 'bg-rose-950/90 border-rose-500/70 shadow-lg shadow-rose-950/50' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                }`}
            >
              <div className="flex items-center gap-2">
                <span className="w-5 h-5 rounded-md bg-rose-500/20 text-rose-400 flex items-center justify-center font-bold text-[10px] font-mono">3</span>
                <div>
                  <span className="text-[10px] font-mono text-slate-400 block">18:49:00 IST</span>
                  <span className="text-rose-300 font-bold text-xs">Completion Drops</span>
                </div>
              </div>
            </button>

            <button
              onClick={() => setCurrentSec(1200)}
              className={`p-2.5 rounded-xl border text-left transition floating-pill cursor-pointer ${currentSec >= 1200 ? 'bg-slate-800/90 border-slate-600 shadow-lg shadow-slate-950/50' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                }`}
            >
              <div className="flex items-center gap-2">
                <span className="w-5 h-5 rounded-md bg-slate-500/20 text-slate-400 flex items-center justify-center font-bold text-[10px] font-mono">4</span>
                <div>
                  <span className="text-[10px] font-mono text-slate-400 block">18:50:00 IST</span>
                  <span className="text-slate-400 font-bold text-xs">502 Alarms (Symptom)</span>
                </div>
              </div>
            </button>
          </div>
        </section>
      );
    }

    function ClarionApp() {
      const [theme, setTheme] = useState(() => localStorage.getItem("clarion_theme") || "dark");
      const [scenario, setScenario] = useState("festival_deadlock");
      const [backend, setBackend] = useState("csv");
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [robustness, setRobustness] = useState(null);
      const [phase, setPhase] = useState("idle");
      const [streamedSteps, setStreamedSteps] = useState([]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [showDossierModal, setShowDossierModal] = useState(false);
      const [dossierMarkdown, setDossierMarkdown] = useState("");
      const [dossierId, setDossierId] = useState("");

      const [showHistoryDrawer, setShowHistoryDrawer] = useState(false);
      const [historyDossiers, setHistoryDossiers] = useState([]);
      const [loadingHistory, setLoadingHistory] = useState(false);
      const [feedbackToast, setFeedbackToast] = useState(null);
      const [feedbackLogged, setFeedbackLogged] = useState({});
      const [authUser, setAuthUser] = useState(null);

      useEffect(() => {
        fetch('/auth/me')
          .then(res => res.json())
          .then(data => {
            if (data.authenticated && data.user) {
              setAuthUser(data.user);
            }
          })
          .catch(err => console.error('[Clarion Auth]', err));
      }, []);

      const terminalContainerRef = useRef(null);
      const lowerSectionRef = useRef(null);
      const intervalRef = useRef(null);
      const timeoutRef = useRef(null);
      const timeoutVerdictRef = useRef(null);

      useEffect(() => {
        const root = document.documentElement;
        const body = document.body;
        if (theme === "dark") {
          root.classList.add("dark");
          body.classList.add("theme-dark");
          body.classList.remove("theme-light");
        } else {
          root.classList.remove("dark");
          body.classList.add("theme-light");
          body.classList.remove("theme-dark");
        }
        localStorage.setItem("clarion_theme", theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => (prev === "dark" ? "light" : "dark"));

      const clearTimers = () => {
        if (intervalRef.current) clearInterval(intervalRef.current);
        if (timeoutRef.current) clearTimeout(timeoutRef.current);
        if (timeoutVerdictRef.current) clearTimeout(timeoutVerdictRef.current);
      };

      useEffect(() => () => clearTimers(), []);

      useEffect(() => {
        handleInject(false);
        return () => clearTimers();
      }, [scenario, backend]);

      useEffect(() => {
        if (phase === "streaming_trace" && terminalContainerRef.current) {
          terminalContainerRef.current.scrollTop = terminalContainerRef.current.scrollHeight;
        }
      }, [streamedSteps, phase]);

      useEffect(() => {
        if ((phase === "streaming_trace" || phase === "verdict") && lowerSectionRef.current) {
          // Auto-scroll disabled to maintain viewport stability on load
          // lowerSectionRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }, [phase]);

      const isBusy = loading || phase === "naive_alert" || phase === "streaming_trace";

      const handleInject = async (animate = true) => {
        clearTimers();
        setLoading(true);
        try {
          const res = await fetch(`/api/investigate?scenario=${scenario}&backend=${backend}`);
          if (!res.ok) throw new Error("Investigation request failed");
          const data = await res.json();
          setResult(data);
          setDossierId(data?.dossier_id || "");

          fetch(`/api/robustness?scenario=${scenario}&backend=${backend}`)
            .then(r => r.json())
            .then(rob => setRobustness(rob))
            .catch(() => { });

          if (animate) {
            setPhase("naive_alert");
            setStreamedSteps([]);
            timeoutRef.current = setTimeout(() => {
              setPhase("streaming_trace");
              streamTraceSteps(data?.trace || []);
            }, 2400);
          } else {
            setStreamedSteps(data?.trace || []);
            setPhase("verdict");
          }
        } catch (err) {
          console.error("Investigation error:", err);
          setPhase("verdict");
        } finally {
          setLoading(false);
        }
      };

      const streamTraceSteps = (allSteps) => {
        clearTimers();
        if (!Array.isArray(allSteps) || allSteps.length === 0) {
          setStreamedSteps([]);
          setPhase("verdict");
          return;
        }

                    <div className={`flex items-center justify-between pb-4 border-b ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                      <div>
                        <h3 className={`text-base font-black flex items-center gap-2 ${textPrimary}`}>
                          📜 Incident Dossier History
                        </h3>
                        <span className={`text-[11px] font-mono ${textMuted}`}>
                          Persistent Store: SQLite (<span className="text-cyan-400 font-bold">clarion.db</span>)
                        </span>
                      </div>
                      <button onClick={() => setShowHistoryDrawer(false)} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg cursor-pointer">✕</button>
                    </div>

                    <div className="flex-1 overflow-y-auto py-4 space-y-3">
                      {loadingHistory ? (
                        <div className="text-center py-12 text-slate-400">
                          <div className="w-6 h-6 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                          <span className="text-xs font-mono">Querying clarion.db incidents...</span>
                        </div>
                      ) : historyDossiers.length === 0 ? (
                        <div className="text-center py-12 text-slate-400 text-xs font-mono space-y-2">
                          <p>No historical dossiers in SQLite yet.</p>
                          <p className="text-[11px]">Live webhook alerts write persistent dossiers here.</p>
                        </div>
                      ) : (
                        historyDossiers.map((item, idx) => (
                          <div key={item?.dossier_id || idx} className={`p-3.5 border rounded-xl hover:border-cyan-500/50 transition space-y-2 ${tileBg}`}>
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-bold font-mono text-cyan-400">{item?.dossier_id || `DOS-${idx}`}</span>
                              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">
                                {((item?.confidence ?? 0.945) * 100).toFixed(1)}% Conf
                              </span>
                            </div>
                            <div className={`text-sm font-semibold ${textPrimary}`}>{item?.root_cause || "Batching DB-Lock Deadlock"}</div>
                            <div className={`flex items-center justify-between text-[11px] font-mono pt-1 border-t ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                              <span className={textMuted}>{item?.timestamp || "2026-10-07 18:49:00 IST"}</span>
                              <span className="text-indigo-400 font-semibold">{item?.scenario || "festival_deadlock"}</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Dossier Export Modal */}
            {showDossierModal && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className={`border rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl glass-card ${cardBg}`}>
                  <div className={`p-4 border-b flex items-center justify-between ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                    <div>
                      <h3 className={`font-black text-base ${textPrimary}`}>Clarion Auditable Incident Dossier</h3>
                      <span className={`text-xs mono ${textMuted}`}>Dossier ID: {dossierId} | SHA-256 Verified</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => window.print()}
                        className={`px-3 py-1.5 text-xs font-semibold rounded-lg border cursor-pointer ${isDark ? 'bg-slate-800 text-slate-200 border-slate-700' : 'bg-slate-100 text-slate-700 border-slate-300'
                          }`}
                      >
                        Print
                      </button>

                      <button
                        onClick={handleExportGraphSvg}
                        className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow transition flex items-center gap-1.5 cursor-pointer"
                      >
                        📊 Export Graph (SVG)
                      </button>

                      <button
                        onClick={() => window.location.href = `/api/dossier.md?scenario=${scenario}&backend=${backend}`}
                        className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow cursor-pointer"
                      >
                        Download .md
                      </button>

                      <button
                        onClick={() => setShowDossierModal(false)}
                        className="px-3 py-1.5 text-slate-400 hover:text-slate-600 text-xs cursor-pointer"
                      >
                        ✕
                      </button>
                    </div>
                  </div>
                  <div id="print-dossier-area" className={`p-6 overflow-y-auto font-mono text-xs whitespace-pre-wrap leading-relaxed select-text ${isDark ? 'text-slate-200' : 'text-slate-800'}`}>
                    {dossierMarkdown}
                  </div>
                </div>
              </div>
            )}

            {/* Floating Toast Notification */}
            {feedbackToast && (
              <div className={`fixed bottom-6 right-6 z-50 border shadow-2xl px-4 py-3 rounded-2xl flex items-center gap-3 backdrop-blur-md ${isDark ? 'bg-slate-900/95 border-emerald-500/60 text-white shadow-emerald-950/60' : 'bg-white/95 border-emerald-500 text-slate-900 shadow-slate-300'
                }`}>
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                <div className="text-xs font-mono">
                  <span className="font-bold text-emerald-400 block">SRE Operator Feedback Logged</span>
                  <span>{feedbackToast}</span>
                </div>
                <button onClick={() => setFeedbackToast(null)} className="ml-2 text-slate-400 hover:text-slate-600 text-xs cursor-pointer">✕</button>
              </div>
            )}

          </div>
        </div>
      );
    }

    function getNodeX(nodeId) {
      const xMap = {
        node_config_search: 120,
        node_config_batching: 160,
        node_deadlock_audit: 290,
        node_no_deadlocks: 290,
        node_db_locks: 300,
        node_alloc_latency: 420,
        node_picker_idle: 430,
        node_dispatch_queue: 560,
        node_anomaly_completion: 680,
        node_dispatch_timeouts: 700,
        node_payment_502: 840,
        node_upi_capture: 860,
        node_poll_timing: 980,
        node_weather_rejection: 990,
      };
      return xMap[nodeId] || 500;
    }

    function truncateText(str, max) {
      if (!str) return "";
      return str.length > max ? str.slice(0, max - 2) + ".." : str;
    }

    const rootElement = document.getElementById("root");
    const reactRoot = ReactDOM.createRoot(rootElement);
    reactRoot.render(<ClarionApp />);
  </script>
</body>

</html>
