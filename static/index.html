    function ClarionApp() {
      const [scenarioKey, setScenarioKey] = useState("festival_deadlock");
      const currentScenario = SCENARIO_DATABASE[scenarioKey];

      // Reactive states
      const [selectedStepId, setSelectedStepId] = useState("step_1");
      const [appliedRemediations, setAppliedRemediations] = useState({});
      const [isAutoExecuting, setIsAutoExecuting] = useState(false);
      const [executionProgress, setExecutionProgress] = useState(0);
      const [liveExecutionLogs, setLiveExecutionLogs] = useState([]);
      const [logSearchQuery, setLogSearchQuery] = useState("");
      
      // Modals
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [showNoiseModal, setShowNoiseModal] = useState(false);
      const [uploadNotification, setUploadNotification] = useState("");

      // Counterfactual simulation slider (Minutes saved)
      const [counterfactualMinutes, setCounterfactualMinutes] = useState(0);

      // Reset reactive controls when switching scenario
      useEffect(() => {
        setSelectedStepId("step_1");
        setAppliedRemediations({});
        setIsAutoExecuting(false);
        setExecutionProgress(0);
        setLiveExecutionLogs([]);
        setCounterfactualMinutes(0);
      }, [scenarioKey]);

      const selectedStep = useMemo(() => {
        return currentScenario.steps.find(s => s.id === selectedStepId) || currentScenario.steps[0];
      }, [currentScenario, selectedStepId]);

      // Calculate total remediation recovery fraction (0.0 to 1.0)
      const totalRecoveryShare = useMemo(() => {
        return currentScenario.remediations.reduce((acc, rem) => {
          return appliedRemediations[rem.id] ? acc + rem.recoveryShare : acc;
        }, 0);
      }, [currentScenario, appliedRemediations]);

      const isFullyHealed = totalRecoveryShare >= 0.99;

      // Dynamic business metrics reacting to applied remediations
      const currentDropPct = useMemo(() => {
        const val = currentScenario.baseDropPct * (1 - totalRecoveryShare);
        return Math.max(0, val).toFixed(1);
      }, [currentScenario, totalRecoveryShare]);

      const currentRevenueRisk = useMemo(() => {
        const val = currentScenario.baseRevenueRiskLakhs * (1 - totalRecoveryShare);
        return Math.max(0, val).toFixed(2);
      }, [currentScenario, totalRecoveryShare]);

      const currentOrdersLost = useMemo(() => {
        const val = Math.round(currentScenario.baseOrdersLost * (1 - totalRecoveryShare));
        return Math.max(0, val).toLocaleString();
      }, [currentScenario, totalRecoveryShare]);

      const currentKpi = useMemo(() => {
        const totalGap = currentScenario.baselineKpi - currentScenario.incidentKpi;
        const current = currentScenario.incidentKpi + (totalGap * totalRecoveryShare);
        return Math.min(currentScenario.baselineKpi, current).toFixed(1);
      }, [currentScenario, totalRecoveryShare]);

      // Handle step toggle in remediation checklist
      const handleToggleRemediation = (remId) => {
        setAppliedRemediations(prev => ({
          ...prev,
          [remId]: !prev[remId]
        }));
      };

      // Execute All Remediation Sequence
      const handleExecuteAll = () => {
        if (isAutoExecuting || isFullyHealed) return;
        setIsAutoExecuting(true);
        setLiveExecutionLogs(["[Clarion] Autonomous resolution loop initiated..."]);

        currentScenario.remediations.forEach((rem, idx) => {
          setTimeout(() => {
            setAppliedRemediations(prev => ({ ...prev, [rem.id]: true }));
            setLiveExecutionLogs(prev => [
              ...prev,
              `[Resolved] Step ${idx + 1}: ${rem.title}`,
              `  ↳ Executed: ${rem.command}`
            ]);
            setExecutionProgress(Math.round(((idx + 1) / currentScenario.remediations.length) * 100));

            if (idx === currentScenario.remediations.length - 1) {
              setTimeout(() => {
                setIsAutoExecuting(false);
                setLiveExecutionLogs(prev => [
                  ...prev,
                  `✓ Complete: All ${currentScenario.remediations.length} interventions applied. Completion restored to ${currentScenario.baselineKpi}%!`
                ]);
              }, 400);
            }
          }, (idx + 1) * 750);
        });
      };

      // Reset Fixes
      const handleResetRemediation = () => {
        setAppliedRemediations({});
        setIsAutoExecuting(false);
        setExecutionProgress(0);
        setLiveExecutionLogs([]);
      };

                            </span>
                          </div>
                          <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded ${
                            isApplied ? 'bg-emerald-200 text-emerald-900' : 'bg-slate-200 text-slate-700'
                          }`}>
                            +{Math.round(rem.recoveryShare * 100)}% Effect
                          </span>
                        </div>
                        <p className="text-[11px] text-slate-500 pl-6 leading-relaxed">
                          {rem.explanation}
                        </p>
                        <div className="pl-6 font-mono text-[10px] text-slate-400">
                          {rem.command}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Action Buttons */}
                <div className="pt-2 space-y-2">
                  <button
                    onClick={handleExecuteAll}
                    disabled={isAutoExecuting || isFullyHealed}
                    className={`w-full py-3.5 px-4 rounded-2xl font-bold text-xs uppercase tracking-wider shadow-md transition-all flex items-center justify-center gap-2 ${
                      isFullyHealed
                        ? 'bg-emerald-600 text-white cursor-default'
                        : isAutoExecuting
                        ? 'bg-slate-300 text-slate-500 cursor-not-allowed'
                        : 'bg-rose-700 hover:bg-rose-800 active:scale-[0.99] text-white shadow-rose-900/20 cursor-pointer'
                    }`}
                  >
                    {isFullyHealed ? (
                      <>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                        </svg>
                        All Fixes Executed (Fully Nominal)
                      </>
                    ) : isAutoExecuting ? (
                      <>
                        <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        Applying Remediation Steps ({executionProgress}%)...
                      </>
                    ) : (
                      <>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        Approve &amp; Execute All Fixes
                      </>
                    )}
                  </button>

                  {totalRecoveryShare > 0 && !isAutoExecuting && (
                    <button
                      onClick={handleResetRemediation}
                      className="w-full py-2 text-xs font-semibold text-slate-500 hover:text-slate-800 underline transition cursor-pointer"
                    >
                      Reset and Re-simulate Incident Alert State
                    </button>
                  )}
                </div>

                {/* Live Resolution Execution Console Drawer */}
                {liveExecutionLogs.length > 0 && (
                  <div className="mt-3 p-3.5 bg-slate-900 rounded-2xl text-slate-200 font-mono text-[11px] space-y-1.5 shadow-inner">
                    <span className="text-[10px] text-slate-500 uppercase tracking-wider block font-bold">
                      Autonomous Remediation Live Execution Trace:
                    </span>
                    {liveExecutionLogs.map((entry, i) => (
                      <div key={i} className="leading-tight text-slate-300">
                        {entry}
                      </div>
                    ))}
                  </div>
                )}

              </div>

            </div>

          </div>

          {}
          
          {/* Modal 1: Custom Telemetry File Upload (DuckDB Engine) */}
          {showUploadModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-900 text-base">Ingest Custom Incident Telemetry</h3>
                  <button onClick={() => setShowUploadModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold cursor-pointer">&times;</button>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Upload raw CSV or JSON files matching schema: <code className="bg-slate-100 px-1 py-0.5 rounded text-rose-700">timestamp, metric_name, value, event_type</code>. Clarion parses files locally with an in-memory DuckDB engine to compute Bayesian likelihoods offline with zero hallucinations.
                </p>
                <div className="border-2 border-dashed border-slate-300 hover:border-rose-500 rounded-2xl p-6 text-center transition cursor-pointer">
                  <input
                    type="file"
                    accept=".csv,.json"
                    onChange={handleSimulateUpload}
                    id="duckdb-file-upload"
                    className="hidden"
                  />
                  <label htmlFor="duckdb-file-upload" className="cursor-pointer block space-y-2">
                    <div className="w-10 h-10 rounded-full bg-rose-50 text-rose-700 mx-auto flex items-center justify-center">
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                      </svg>
                    </div>
                    <span className="text-xs font-bold text-rose-700 block">Click to select CSV or JSON file</span>
                    <span className="text-[11px] text-slate-400 block">DuckDB in-process pushdown query executor</span>
                  </label>
                </div>
                {uploadNotification && (
                  <div className="p-3 bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs rounded-xl font-mono leading-relaxed">
                    {uploadNotification}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal 2: Timeline Delta Deep-Dive for Suppressed False Alarms */}
          {showNoiseModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                    <h3 className="font-bold text-slate-900 text-base">Why Clarion Suppressed This Alarm</h3>
                  </div>
                  <button onClick={() => setShowNoiseModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold cursor-pointer">&times;</button>
                </div>

                <div className="space-y-3 text-xs text-slate-700 leading-relaxed">
                  <div className="p-3 rounded-xl bg-slate-50 border border-slate-200">
                    <strong className="block text-slate-900 mb-1">Temporal Sequence Contradiction:</strong>
                    <span>The alleged failure signal (<strong>{currentScenario.noiseTitle}</strong>) breached alert thresholds at <strong>{currentScenario.noiseOnset}</strong>, exactly 60 seconds AFTER completion rates had already collapsed at <strong>{currentScenario.onsetTimestamp}</strong>. A consequence cannot cause its own predecessor.</span>
                  </div>

                  <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-950">
                    <strong className="block text-emerald-900 mb-1">Causal Independence Proof:</strong>
                    <span>{currentScenario.noiseExplanation}</span>
                  </div>

                  <p className="text-[11px] text-slate-500">
                    Traditional rule-based monitoring alerts on volume alone, misdirecting SREs toward payment providers. Clarion calculates likelihood ratios across causal paths to eliminate distraction.
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* Modal 3: Printable Executive Incident Dossier */}
          {showReportModal && (
            <div id="print-report-modal" className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto space-y-4">
                <div className="flex items-center justify-between pb-4 border-b border-slate-200">
                  <div>
                    <h3 className="text-lg font-black text-slate-900">Clarion Executive Incident Dossier</h3>
                    <span className="text-xs text-slate-500 font-mono">Incident Stamp #{currentScenario.id.toUpperCase()} • Generated Live</span>
                  </div>
                  <div className="flex items-center gap-2 no-print">
                    <button
                      onClick={() => window.print()}
                      className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl cursor-pointer"
                    >
                      Print PDF
                    </button>
                    <button
                      onClick={() => setShowReportModal(false)}
                      className="text-slate-400 hover:text-slate-600 px-2 py-1 text-base font-bold cursor-pointer"
                    >
                      &times;
                    </button>
                  </div>
                </div>

                <div className="space-y-4 text-xs text-slate-700 leading-relaxed">
                  <div className="grid grid-cols-2 gap-3 p-3.5 bg-slate-50 rounded-2xl border border-slate-200 font-medium">
                    <div><strong>Hub Location:</strong> {currentScenario.hubName}</div>
                    <div><strong>Incident Onset:</strong> {currentScenario.onsetTimestamp}</div>
                    <div><strong>Orders Affected:</strong> {currentScenario.baseOrdersLost.toLocaleString()} orders</div>
                    <div><strong>Revenue At Risk:</strong> ₹{currentScenario.baseRevenueRiskLakhs} Lakhs</div>
                  </div>

                  <div>
                    <h4 className="font-bold text-slate-900 mb-1 text-sm">Autonomous Diagnostic Verdict:</h4>
                    <p className="p-3 bg-rose-50 border border-rose-200 text-rose-950 font-semibold rounded-xl">
                      {currentScenario.primaryRootTitle} (Confidence: {currentScenario.primaryConfidence}%)
                    </p>
                  </div>

                  <div>
                    <h4 className="font-bold text-slate-900 mb-1 text-sm">Chronological Cascade:</h4>
                    <ol className="list-decimal pl-5 space-y-1 text-slate-600 font-medium">
                      {currentScenario.steps.map(s => (
                        <li key={s.id}>
                          <strong>{s.name} ({s.time}):</strong> {s.summary}
                        </li>
                      ))}
                    </ol>
                  </div>

                  <div>
                    <h4 className="font-bold text-slate-900 mb-1 text-sm">Refuted Red Herring:</h4>
                    <p className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-600">
                      <strong>{currentScenario.noiseTitle}:</strong> {currentScenario.noiseExplanation}
                    </p>
                  </div>

                  <div>
                    <h4 className="font-bold text-slate-900 mb-1 text-sm">Recommended Autonomous Remediation:</h4>
                    <ol className="list-decimal pl-5 space-y-1 text-slate-800 font-medium">
                      {currentScenario.remediations.map(r => (
                        <li key={r.id}>
                          {r.title} — <em>{r.command}</em>
                        </li>
                      ))}
                    </ol>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const appRoot = ReactDOM.createRoot(rootElement);
    appRoot.render(<ClarionApp />);
  </script>
</body>
</html>
