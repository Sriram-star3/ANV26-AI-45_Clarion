<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarion — Deterministic Causal Reasoning Engine</title>
  <script src="./vendor/tailwind.js"></script>
  <script src="./vendor/react.js"></script>
  <script src="./vendor/react-dom.js"></script>
  <script src="./vendor/babel.js"></script>
  <style>
    /* Custom dark theme styling, projector-readable typography */

    <script src="/static/js/business_view.js"></script>
    <script src="/static/js/slack_export.js"></script>
    <script src="/static/js/confidence_modal.js"></script>
    <script src="/static/js/history_modal.js"></script>
    body {
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      transition: background 0.35s ease, color 0.25s ease;
      min-height: 100vh;
      background-attachment: fixed !important;
    }

    /* Ambient Dynamic Mesh Gradients */
    body.theme-dark {
      background:
        radial-gradient(circle at 8% 12%, rgba(99, 102, 241, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 92% 18%, rgba(6, 182, 212, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 88%, rgba(16, 185, 129, 0.20) 0%, transparent 48%),
        radial-gradient(circle at 15% 85%, rgba(168, 85, 247, 0.16) 0%, transparent 45%),
        linear-gradient(135deg, #070914 0%, #0d1226 30%, #08121f 65%, #040e16 100%);
      color: #f1f5f9;
    }

    body.theme-light {
      background:
        radial-gradient(circle at 10% 12%, rgba(129, 140, 248, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 90% 15%, rgba(56, 189, 248, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(52, 211, 153, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 15% 85%, rgba(232, 121, 249, 0.15) 0%, transparent 45%),
        linear-gradient(135deg, #eef2ff 0%, #f1f5f9 35%, #e0f2fe 70%, #ecfdf5 100%);
      color: #0f172a;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    @keyframes flowPulse {
      from {
        stroke-dashoffset: 28;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    .animate-causal-flow {
      stroke-dasharray: 7, 7;
      animation: flowPulse 1.2s linear infinite;
    }

    .frosted-glass {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #print-dossier-area,
      #print-dossier-area * {
        visibility: visible;
      }

      #print-dossier-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
        padding: 24px;
      }
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
  </style>
</head>

<body class="theme-dark antialiased selection:bg-cyan-400 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function ClarionApp() {
      const [theme, setTheme] = useState(() => localStorage.getItem("clarion_theme") || "dark");
      const [scenario, setScenario] = useState("festival_deadlock");
      const [backend, setBackend] = useState("csv");
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [robustness, setRobustness] = useState(null);
      const [phase, setPhase] = useState("idle");
      const [streamedSteps, setStreamedSteps] = useState([]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [showDossierModal, setShowDossierModal] = useState(false);
      const [dossierMarkdown, setDossierMarkdown] = useState("");
      const [dossierId, setDossierId] = useState("");

      // Backend Persistence & Feedback States
      const [showHistoryDrawer, setShowHistoryDrawer] = useState(false);
      const [historyDossiers, setHistoryDossiers] = useState([]);
      const [loadingHistory, setLoadingHistory] = useState(false);
      const [feedbackToast, setFeedbackToast] = useState(null);
      const [feedbackLogged, setFeedbackLogged] = useState({});

      const terminalContainerRef = useRef(null);
      const lowerSectionRef = useRef(null);
      const intervalRef = useRef(null);
      const timeoutRef = useRef(null);
      const timeoutVerdictRef = useRef(null);

      useEffect(() => {
        const root = document.documentElement;
        const body = document.body;
        if (theme === "dark") {
          root.classList.add("dark");
          body.classList.add("theme-dark");
          body.classList.remove("theme-light");
        } else {
          root.classList.remove("dark");
          body.classList.add("theme-light");
          body.classList.remove("theme-dark");
        }
        localStorage.setItem("clarion_theme", theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => (prev === "dark" ? "light" : "dark"));

      const clearTimers = () => {
        if (intervalRef.current) clearInterval(intervalRef.current);
        if (timeoutRef.current) clearTimeout(timeoutRef.current);
        if (timeoutVerdictRef.current) clearTimeout(timeoutVerdictRef.current);
      };

      useEffect(() => () => clearTimers(), []);

      useEffect(() => {
        handleInject(false);
        return () => clearTimers();
      }, [scenario, backend]);

      useEffect(() => {
        if (phase === "streaming_trace" && terminalContainerRef.current) {
          terminalContainerRef.current.scrollTop = terminalContainerRef.current.scrollHeight;
        }
      }, [streamedSteps, phase]);

      useEffect(() => {
        if ((phase === "streaming_trace" || phase === "verdict") && lowerSectionRef.current) {
          lowerSectionRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }, [phase]);

      const isBusy = loading || phase === "naive_alert" || phase === "streaming_trace";

      const handleInject = async (animate = true) => {
        clearTimers();
        setLoading(true);
        try {
          const res = await fetch(`/api/investigate?scenario=${scenario}&backend=${backend}`);
          if (!res.ok) throw new Error("Investigation request failed");
          const data = await res.json();
          setResult(data);
          setDossierId(data?.dossier_id || "");

          fetch(`/api/robustness?scenario=${scenario}&backend=${backend}`)
            .then(r => r.json())
            .then(rob => setRobustness(rob))
            .catch(() => { });

          if (animate) {
            setPhase("naive_alert");
            setStreamedSteps([]);
            timeoutRef.current = setTimeout(() => {
              setPhase("streaming_trace");
              streamTraceSteps(data?.trace || []);
            }, 2400);
          } else {
            setStreamedSteps(data?.trace || []);
            setPhase("verdict");
          }
        } catch (err) {
          console.error("Investigation error:", err);
          setPhase("verdict");
        } finally {
          setLoading(false);
        }
      };

      const streamTraceSteps = (allSteps) => {
        clearTimers();
        if (!Array.isArray(allSteps) || allSteps.length === 0) {
          setStreamedSteps([]);
          setPhase("verdict");
          return;
        }

        let currentIdx = 0;
        intervalRef.current = setInterval(() => {
          if (currentIdx < allSteps.length) {
            const step = allSteps[currentIdx];
            if (step) setStreamedSteps(prev => [...prev, step]);
            currentIdx++;
          } else {
            if (intervalRef.current) clearInterval(intervalRef.current);
            timeoutVerdictRef.current = setTimeout(() => setPhase("verdict"), 300);
          }
        }, 110);
      };

      const handleOpenDossier = async () => {
        try {
          const res = await fetch(`/api/dossier?scenario=${scenario}&backend=${backend}`);
          const data = await res.json();
          setDossierMarkdown(data?.markdown || "");
          setShowDossierModal(true);
        } catch (e) {
          console.error("Dossier error:", e);
        }
      };

      const handleOpenHistory = async () => {
        setShowHistoryDrawer(true);
        setLoadingHistory(true);
        try {
          const res = await fetch("/api/v1/history");
          if (res.ok) {
            const data = await res.json();
            const list = Array.isArray(data) ? data : (data?.dossiers || []);
            setHistoryDossiers(list);
          } else {
            setHistoryDossiers([]);
          }
        } catch (e) {
          setHistoryDossiers([]);
        } finally {
          setLoadingHistory(false);
        }
      };

      const handleSendFeedback = async (hypothesisName, feedbackType) => {
        try {
          await fetch("/api/v1/feedback", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Clarion-Role": "sre-lead"
            },
            body: JSON.stringify({
              dossier_id: dossierId || "DOS-4962FFE2",
              hypothesis_id: hypothesisName || "Batching DB-Lock Deadlock",
              feedback_type: feedbackType
            })
          });
          const delta = feedbackType === "confirm" ? "+0.5" : "-0.5";
          setFeedbackToast(`Prior Log-Odds shifted ${delta} · Saved to clarion.db`);
          setFeedbackLogged(prev => ({ ...prev, [hypothesisName]: feedbackType }));
          setTimeout(() => setFeedbackToast(null), 4000);
        } catch (err) {
          setFeedbackToast("Feedback logged to local engine");
          setTimeout(() => setFeedbackToast(null), 4000);
        }
      };

      const isDark = theme === "dark";

      if (!result) {
        return (
          <div className="flex items-center justify-center min-h-screen">
            <div className="text-center space-y-4">
              <div className="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto shadow-xl shadow-cyan-400/30"></div>
              <div className="font-mono text-xs tracking-widest text-cyan-400 uppercase font-semibold">Booting Clarion Offline Runtime...</div>
            </div>
          </div>
        );
      }

      const anomaly = result?.anomaly || {
        drop_pct: 0, baseline: 0, incident: 0, onset: "Unknown",
        window: { baseline: "18:30-18:44", incident: "18:49-21:30" }
      };

      const naive_alert = result?.naive_alert || {
        metric: "payment_502_count", label: "Payment Gateway 502 Surge", sigma: 0, onset: "Unknown", severity: "CRITICAL"
      };

      const ranked = Array.isArray(result?.ranked) ? result.ranked : [];
      const graphNodes = Array.isArray(result?.graph?.nodes) ? result.graph.nodes : [];
      const graphEdges = Array.isArray(result?.graph?.edges) ? result.graph.edges : [];
      const remediation = Array.isArray(result?.remediation) ? result.remediation : [];
      const roi = result?.roi || { manual_s: 16200, e2e_s: 90, reduction_pct: 99.44, compute_ms: 0 };

      const defaultHyp = { id: "H3", name: "Hypothesis", confidence: 0, prior: 0, explained_share: 0, recovered_pts: 0, verdict: "UNKNOWN", evidence: [] };
      const rootCause = ranked.find(r => r?.verdict === "ROOT_CAUSE") || ranked[0] || defaultHyp;
      const redHerring = ranked.find(r => r?.verdict === "SUPPRESSED_NOISE") || ranked[Math.max(0, ranked.length - 1)] || defaultHyp;

      const sourceY = { audit: 80, telemetry: 185, fleet: 290, ledger: 395 };

      const rolePalette = {
        root: { stroke: "#ef4444", fill: "#dc2626", glow: "#f87171", badge: "bg-rose-500/10 text-rose-400 border-rose-500/30" },
        anomaly: { stroke: "#f59e0b", fill: "#d97706", glow: "#fbbf24", badge: "bg-amber-500/10 text-amber-400 border-amber-500/30" },
        noise: { stroke: "#64748b", fill: "#475569", glow: "#94a3b8", badge: "bg-slate-500/10 text-slate-400 border-slate-500/30" },
        refutes: { stroke: "#06b6d4", fill: "#0891b2", glow: "#22d3ee", badge: "bg-cyan-500/10 text-cyan-400 border-cyan-500/30" },
        symptom: { stroke: "#eab308", fill: "#ca8a04", glow: "#fde047", badge: "bg-yellow-500/10 text-yellow-400 border-yellow-500/30" },
        operational: { stroke: "#10b981", fill: "#059669", glow: "#34d399", badge: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30" }
      };

      const traceTotal = Math.max(1, Array.isArray(result?.trace) ? result.trace.length : 1);
      const visibleNodeCount = phase === "streaming_trace"
        ? Math.max(3, Math.min(graphNodes.length, Math.floor((streamedSteps.length / traceTotal) * graphNodes.length)))
        : graphNodes.length;

      const activeNodes = graphNodes.slice(0, visibleNodeCount);
      const activeNodeIds = new Set(activeNodes.map(n => n?.id).filter(Boolean));
      const activeEdges = graphEdges.filter(e => e?.src && e?.dst && activeNodeIds.has(e.src) && activeNodeIds.has(e.dst));

      // Translucent Glass Classes that let the gradient mesh shine through
      const cardBg = isDark
        ? "bg-slate-900/65 border-slate-700/50 shadow-2xl shadow-indigo-950/20 frosted-glass"
        : "bg-white/80 border-slate-200/90 shadow-lg shadow-indigo-100/50 frosted-glass";
      const tileBg = isDark
        ? "bg-slate-950/60 border-slate-800/80 frosted-glass"
        : "bg-white/65 border-slate-200/80 frosted-glass";
      const textPrimary = isDark ? "text-slate-100" : "text-slate-900";
      const textMuted = isDark ? "text-slate-400" : "text-slate-500";
      const textSecondary = isDark ? "text-slate-300" : "text-slate-700";

      return (
        <div className="p-3 md:p-6">
          <div className="max-w-[1720px] mx-auto space-y-5">

            {/* Top Navigation Bar with Frosted Translucency */}
            <header className={`border rounded-2xl p-4.5 ${cardBg}`}>
              <div className="flex flex-col xl:flex-row items-start xl:items-center justify-between gap-4">

                {/* Branding & Status Badges */}
                <div className="space-y-1">
                  <div className="flex flex-wrap items-center gap-2.5">
                    <span className="text-2xl md:text-3xl font-black tracking-tight bg-gradient-to-r from-cyan-400 via-indigo-300 to-emerald-400 bg-clip-text text-transparent">
                      CLARION
                    </span>
                    <span className={`text-[11px] px-2.5 py-0.5 rounded-md font-mono font-medium border ${isDark ? 'bg-slate-900/80 text-cyan-300 border-cyan-500/30' : 'bg-white/80 text-cyan-800 border-cyan-300'}`}>
                      v1.0-deterministic
                    </span>
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-emerald-950/70 border border-emerald-500/40 text-emerald-400 text-xs font-semibold">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                      Offline Engine
                    </span>
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-cyan-950/70 border border-cyan-500/40 text-cyan-300 text-xs font-mono font-medium">
                      <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
                      DuckDB Active (&lt;50ms)
                    </span>
                  </div>
                  <p className={`text-xs ${textMuted} tracking-normal`}>
                    Bayesian Causal Evidence Fusion &amp; Counterfactual Signal Suppression
                  </p>
                </div>

                {/* Compact Single-Row Action Toolbar */}
                <div className="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                  {/* Theme Switcher */}
                  <button
                    onClick={toggleTheme}
                    title="Toggle Theme"
                    className={`px-3 py-1.5 rounded-lg border font-mono text-xs font-semibold flex items-center gap-1.5 transition-all cursor-pointer ${isDark
                        ? 'bg-slate-900/90 hover:bg-slate-800 text-amber-300 border-slate-700 shadow-md'
                        : 'bg-white hover:bg-slate-50 text-indigo-700 border-slate-300 shadow-md'
                      }`}
                  >
                    <span>{isDark ? '☀️' : '🌙'}</span>
                    <span className="hidden sm:inline">{isDark ? 'Light Mode' : 'Dark Mode'}</span>
                  </button>

                  {/* Scenario Select */}
                  <div className={`flex items-center gap-1.5 border rounded-lg px-2.5 py-1.5 text-xs font-mono ${isDark ? 'bg-slate-900/90 border-slate-700/80 text-slate-200 shadow-md' : 'bg-white border-slate-300 text-slate-800 shadow-md'}`}>
                    <span className={textMuted}>Scenario:</span>
                    <select
                      value={scenario}
                      disabled={isBusy}
                      onChange={(e) => setScenario(e.target.value)}
                      className="bg-transparent font-semibold focus:outline-none cursor-pointer"
                    >
                      <option value="festival_deadlock" className={isDark ? "bg-slate-900" : "bg-white"}>festival_deadlock (DB-Lock Issue)</option>
                      <option value="gateway_outage" className={isDark ? "bg-slate-900" : "bg-white"}>gateway_outage (Gateway Crash)</option>
                    </select>
                  </div>

                  {/* Engine Select */}
                  <div className={`flex items-center gap-1.5 border rounded-lg px-2.5 py-1.5 text-xs font-mono ${isDark ? 'bg-slate-900/90 border-slate-700/80 text-slate-200 shadow-md' : 'bg-white border-slate-300 text-slate-800 shadow-md'}`}>
                    <span className={textMuted}>Engine:</span>
                    <select
                      value={backend}
                      disabled={isBusy}
                      onChange={(e) => setBackend(e.target.value)}
                      className="bg-transparent font-semibold focus:outline-none cursor-pointer"
                    >
                      <option value="csv" className={isDark ? "bg-slate-900" : "bg-white"}>CSV Micro-batch</option>
                      <option value="duckdb" className={isDark ? "bg-slate-900" : "bg-white"}>DuckDB Pushdown</option>
                    </select>
                  </div>

                  {/* Incident History Drawer */}
                  <button
                    onClick={handleOpenHistory}
                    className={`px-3 py-1.5 font-semibold text-xs rounded-lg border transition-all flex items-center gap-1.5 cursor-pointer ${isDark ? 'bg-slate-900/90 hover:bg-slate-800 text-cyan-300 border-cyan-500/40 shadow-md' : 'bg-white hover:bg-slate-50 text-cyan-700 border-cyan-500/40 shadow-md'
                      }`}
                  >
                    📜 Incident History
                  </button>

                  {/* Export Dossier */}
                  <button
                    onClick={handleOpenDossier}
                    className={`px-3 py-1.5 font-semibold text-xs rounded-lg border transition-all flex items-center gap-1.5 cursor-pointer ${isDark ? 'bg-slate-900/90 hover:bg-slate-800 text-slate-200 border-slate-700 shadow-md' : 'bg-white hover:bg-slate-50 text-slate-700 border-slate-300 shadow-md'
                      }`}
                  >
                    📑 Export Dossier
                  </button>

                  {/* Inject Anomaly Button */}
                  <button
                    onClick={() => handleInject(true)}
                    disabled={isBusy}
                    className={`px-3.5 py-1.5 font-bold text-xs rounded-lg transition-all flex items-center gap-1.5 shadow-lg cursor-pointer ${isBusy
                        ? 'bg-slate-700 text-slate-400 cursor-not-allowed'
                        : 'bg-gradient-to-r from-indigo-600 via-indigo-500 to-sky-500 hover:opacity-90 active:scale-95 text-white shadow-indigo-600/30'
                      }`}
                  >
                    {loading ? (
                      <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    ) : (
                      <span>⚡</span>
                    )}
                    {isBusy ? 'Analyzing...' : 'Inject Anomaly'}
                  </button>
                </div>

              </div>
            </header>

            {/* Naive Monitoring Alert Simulation Banner */}
            {phase === "naive_alert" && (
              <div className="bg-gradient-to-r from-red-950/90 via-red-900/80 to-rose-950/90 border-2 border-red-500 rounded-2xl p-5 shadow-2xl shadow-red-950/50 animate-pulse">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <span className="flex h-12 w-12 items-center justify-center rounded-2xl bg-red-600/30 border border-red-500/50 text-red-300 text-2xl font-black">!</span>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded bg-red-600 text-white font-mono">
                          NAIVE MONITORING ALERT — {naive_alert?.severity || "CRITICAL"}
                        </span>
                        <span className="text-xs text-red-200 mono font-semibold">
                          Breach Onset: {naive_alert?.onset || "Unknown"} IST
                        </span>
                      </div>
                      <h2 className="text-xl md:text-2xl font-black text-white mt-1">
                        {naive_alert?.label} detected (+{naive_alert?.sigma}σ anomaly)
                      </h2>
                      <p className="text-xs text-red-200/80 mt-0.5">
                        Standard threshold alert triggered by symptom metric. Running causal pushdown in DuckDB...
                      </p>
                    </div>
                  </div>
                  <div className="text-right">
                    <span className="text-[11px] text-red-300 block uppercase font-mono font-semibold">Symptom Deviation</span>
                    <span className="text-4xl font-black text-red-400 mono">+{naive_alert?.sigma}σ</span>
                  </div>
                </div>
              </div>
            )}

            {/* Bento-Grid Incident Status Metrics */}
            <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className={`p-4 rounded-2xl border ${tileBg}`}>
                <div className="flex items-center justify-between">
                  <span className={`text-[11px] uppercase tracking-wider font-bold mono ${textMuted}`}>Incident Status</span>
                  <span className="text-xs font-mono text-cyan-400 font-semibold">BLR-S Hub</span>
                </div>
                <div className="flex items-center gap-2.5 mt-2">
                  <span className={`w-3 h-3 rounded-full ${phase === 'verdict' ? 'bg-emerald-400 shadow-md shadow-emerald-400/50' : 'bg-amber-400 animate-ping'}`}></span>
                  <span className={`text-base font-extrabold uppercase tracking-wide ${textPrimary}`}>
                    {phase === 'verdict' ? 'CAUSAL VERDICT REACHED' : 'TRACING ANOMALY'}
                  </span>
                </div>
                <span className={`text-[11px] mono block mt-2 ${textMuted}`}>Deterministic Evaluation</span>
              </div>

              <div className={`p-4 rounded-2xl border ${tileBg}`}>
                <div className="flex items-center justify-between">
                  <span className={`text-[11px] uppercase tracking-wider font-bold mono ${textMuted}`}>Completion Rate Drop</span>
                  <span className="text-[10px] px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20 font-mono font-bold">CRITICAL IMPACT</span>
                </div>
                <div className="flex items-baseline gap-2 mt-2">
                  <span className="text-3xl font-black text-rose-500 mono tracking-tight">-{anomaly?.drop_pct}%</span>
                  <span className={`text-xs ${textMuted}`}>incident window</span>
                </div>
                <span className={`text-[11px] mono block mt-2 ${textMuted}`}>Severity: Critical Business Degrade</span>
              </div>

              <div className={`p-4 rounded-2xl border ${tileBg}`}>
                <div className="flex items-center justify-between">
                  <span className={`text-[11px] uppercase tracking-wider font-bold mono ${textMuted}`}>KPI Baseline → Incident</span>
                  <span className="text-xs font-mono text-indigo-400 font-semibold">18:49-21:30 IST</span>
                </div>
                <div className="flex items-baseline gap-2 mt-2">
                  <span className={`text-2xl font-black mono ${textPrimary}`}>
                    {((anomaly?.baseline ?? 0) * 100).toFixed(1)}% <span className="text-rose-500 text-lg">→</span> {((anomaly?.incident ?? 0) * 100).toFixed(1)}%
                  </span>
                </div>
                <span className={`text-[11px] mono block mt-2 ${textMuted}`}>Delta: -26.9 percentage points</span>
              </div>

                        <div className="flex items-center justify-between text-[11px] mb-1">
                          <span className={textMuted}>
                            Step [{stepNum.toString().padStart(2, "0")}] → <span className={hypColor}>{stepHyp}</span>
                          </span>
                          <span className="text-indigo-400 font-mono font-bold bg-indigo-950/60 border border-indigo-800/40 px-2 py-0.5 rounded">
                            {step?.tool || "tool"}()
                          </span>
                        </div>
                        <div className={`text-[11px] font-mono ${textMuted}`}>
                          query: <span className={isDark ? "text-cyan-300" : "text-cyan-700"}>{JSON.stringify(step?.query || {})}</span>
                        </div>
                        <div className={`mt-1.5 pl-2.5 border-l-2 font-mono text-xs ${isDark ? 'border-cyan-500/60 text-slate-200' : 'border-indigo-500 text-slate-900'}`}>
                          {step?.result || ""}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Right Column: Ranked Root Causes & Advisory Remediation (5 Cols) */}
              <div className="lg:col-span-5 space-y-5">

                {/* Ranked Causes Card */}
                <div className={`border rounded-2xl p-5 ${cardBg}`}>
                  <h4 className={`text-xs font-black uppercase tracking-wider font-mono mb-3 ${textPrimary}`}>
                    Ranked Probable Root Causes
                  </h4>
                  <div className="space-y-3">
                    {ranked.map((item, idx) => {
                      if (!item) return null;
                      const isRoot = item.verdict === 'ROOT_CAUSE';
                      return (
                        <div key={item.id || idx} className={`p-3.5 border rounded-xl ${isRoot ? (isDark ? 'bg-slate-900/90 border-cyan-500/50' : 'bg-cyan-50/70 border-cyan-300') : tileBg}`}>
                          <div className="flex items-center justify-between mb-1">
                            <div className="flex items-center gap-2">
                              <span className={`font-bold text-xs ${textPrimary}`}>#{idx + 1} {item.name}</span>
                              <span className={`text-[10px] mono font-bold px-1.5 py-0.5 rounded ${isDark ? 'bg-slate-800 text-cyan-300' : 'bg-slate-200 text-slate-700'}`}>
                                {item.id}
                              </span>
                            </div>
                            <span className={`text-[10px] font-mono font-black px-2 py-0.5 rounded uppercase ${isRoot ? 'bg-emerald-600 text-white' :
                                item.verdict === 'SUPPRESSED_NOISE' ? 'bg-slate-500 text-white' :
                                  'bg-indigo-600 text-white'
                              }`}>
                              {item.verdict}
                            </span>
                          </div>

                          <div className={`w-full rounded-full h-2 my-2.5 overflow-hidden ${isDark ? 'bg-slate-800' : 'bg-slate-200'}`}>
                            <div
                              className={`h-full rounded-full transition-all duration-500 ${isRoot ? 'bg-gradient-to-r from-cyan-400 to-emerald-400 shadow-md shadow-cyan-400/50' :
                                  item.verdict === 'SUPPRESSED_NOISE' ? 'bg-slate-500' : 'bg-indigo-500'
                                }`}
                              style={{ width: `${Math.round((item.confidence ?? 0) * 100)}%` }}
                            ></div>
                          </div>

                          <div className={`flex justify-between items-center text-[11px] mono ${textMuted}`}>
                            <span>Prior: {((item.prior ?? 0) * 100).toFixed(0)}%</span>
                            <span className={`font-black ${isRoot ? 'text-emerald-400' : textPrimary}`}>Posterior: {((item.confidence ?? 0) * 100).toFixed(1)}%</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Advisory Remediation Plan */}
                <div className={`border rounded-2xl p-5 ${cardBg}`}>
                  <div className="flex items-center justify-between mb-3">
                    <h4 className={`text-xs font-black uppercase tracking-wider font-mono ${textPrimary}`}>
                      Advisory Remediation Plan
                    </h4>
                    <span className="text-[10px] font-mono font-bold text-amber-400 px-2 py-0.5 bg-amber-500/10 border border-amber-500/30 rounded-full">
                      Human Approval Required
                    </span>
                  </div>

                  <div className="space-y-2.5">
                    {remediation.map((rem, idx) => {
                      if (!rem) return null;
                      const badgeType = idx === 0 ? "ROLLBACK" : idx === 1 ? "DRAIN" : idx === 2 ? "K8S RESTART" : "CONFIG";
                      return (
                        <div key={rem.priority || idx} className={`p-3 border rounded-xl text-xs space-y-1 ${tileBg}`}>
                          <div className="flex items-center justify-between">
                            <span className={`font-bold ${textPrimary}`}>{rem.priority}. {rem.action}</span>
                            <span className="text-[10px] font-mono font-black px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/30">
                              {badgeType}
                            </span>
                          </div>
                          <div className="mono text-[11px] text-cyan-400 font-semibold">{rem.target}</div>
                          <div className={`text-[10px] italic ${textMuted}`}>{rem.advisory}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            </div>

            {/* Slide-over History Drawer */}
            {showHistoryDrawer && (
              <div className="fixed inset-0 z-50 overflow-hidden">
                <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setShowHistoryDrawer(false)}></div>
                <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                  <div className={`w-screen max-w-md border-l p-6 flex flex-col shadow-2xl ${isDark ? 'bg-[#090e1a]/95 border-slate-800 text-slate-100 frosted-glass' : 'bg-white/95 border-slate-200 text-slate-900 frosted-glass'}`}>
                    <div className={`flex items-center justify-between pb-4 border-b ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                      <div>
                        <h3 className={`text-base font-black flex items-center gap-2 ${textPrimary}`}>
                          📜 Incident Dossier History
                        </h3>
                        <span className={`text-[11px] font-mono ${textMuted}`}>
                          Persistent Store: SQLite (<span className="text-cyan-400 font-bold">clarion.db</span>)
                        </span>
                      </div>
                      <button onClick={() => setShowHistoryDrawer(false)} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg cursor-pointer">✕</button>
                    </div>

                    <div className="flex-1 overflow-y-auto py-4 space-y-3">
                      {loadingHistory ? (
                        <div className="text-center py-12 text-slate-400">
                          <div className="w-6 h-6 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                          <span className="text-xs font-mono">Querying clarion.db incidents...</span>
                        </div>
                      ) : historyDossiers.length === 0 ? (
                        <div className="text-center py-12 text-slate-400 text-xs font-mono space-y-2">
                          <p>No historical dossiers in SQLite yet.</p>
                          <p className="text-[11px]">Live webhook alerts write persistent dossiers here.</p>
                        </div>
                      ) : (
                        historyDossiers.map((item, idx) => (
                          <div key={item?.dossier_id || idx} className={`p-3.5 border rounded-xl hover:border-cyan-500/50 transition space-y-2 ${tileBg}`}>
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-bold font-mono text-cyan-400">{item?.dossier_id || `DOS-${idx}`}</span>
                              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">
                                {((item?.confidence ?? 0.945) * 100).toFixed(1)}% Conf
                              </span>
                            </div>
                            <div className={`text-sm font-semibold ${textPrimary}`}>{item?.root_cause || "Batching DB-Lock Deadlock"}</div>
                            <div className={`flex items-center justify-between text-[11px] font-mono pt-1 border-t ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                              <span className={textMuted}>{item?.timestamp || "2026-10-07 18:49:00 IST"}</span>
                              <span className="text-indigo-400 font-semibold">{item?.scenario || "festival_deadlock"}</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Dossier Export Modal */}
            {showDossierModal && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className={`border rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl ${cardBg}`}>
                  <div className={`p-4 border-b flex items-center justify-between ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                    <div>
                      <h3 className={`font-black text-base ${textPrimary}`}>Clarion Auditable Incident Dossier</h3>
                      <span className={`text-xs mono ${textMuted}`}>Dossier ID: {dossierId} | SHA-256 Verified</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => window.print()} className={`px-3 py-1.5 text-xs font-semibold rounded-lg border cursor-pointer ${isDark ? 'bg-slate-800 text-slate-200 border-slate-700' : 'bg-slate-100 text-slate-700 border-slate-300'}`}>Print</button>
                      <button onClick={() => window.location.href = `/api/dossier.md?scenario=${scenario}&backend=${backend}`} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow cursor-pointer">Download .md</button>
                      <button onClick={() => setShowDossierModal(false)} className="px-3 py-1.5 text-slate-400 hover:text-slate-600 text-xs cursor-pointer">✕</button>
                    </div>
                  </div>
                  <div id="print-dossier-area" className={`p-6 overflow-y-auto font-mono text-xs whitespace-pre-wrap leading-relaxed select-text ${isDark ? 'text-slate-200' : 'text-slate-800'}`}>
                    {dossierMarkdown}
                  </div>
                </div>
              </div>
            )}

            {/* Floating Toast Notification */}
            {feedbackToast && (
              <div className={`fixed bottom-6 right-6 z-50 border shadow-2xl px-4 py-3 rounded-2xl flex items-center gap-3 backdrop-blur-md ${isDark ? 'bg-slate-900/95 border-emerald-500/60 text-white shadow-emerald-950/60' : 'bg-white/95 border-emerald-500 text-slate-900 shadow-slate-300'
                }`}>
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                <div className="text-xs font-mono">
                  <span className="font-bold text-emerald-400 block">SRE Operator Feedback Logged</span>
                  <span>{feedbackToast}</span>
                </div>
                <button onClick={() => setFeedbackToast(null)} className="ml-2 text-slate-400 hover:text-slate-600 text-xs cursor-pointer">✕</button>
              </div>
            )}

          </div>
        </div>
      );
    }

    function getNodeX(nodeId) {
      const xMap = {
        node_config_search: 120,
        node_config_batching: 160,
        node_deadlock_audit: 290,
        node_no_deadlocks: 290,
        node_db_locks: 300,
        node_alloc_latency: 420,
        node_picker_idle: 430,
        node_dispatch_queue: 560,
        node_anomaly_completion: 680,
        node_dispatch_timeouts: 700,
        node_payment_502: 840,
        node_upi_capture: 860,
        node_poll_timing: 980,
        node_weather_rejection: 990,
      };
      return xMap[nodeId] || 500;
    }

    function truncateText(str, max) {
      if (!str) return "";
      return str.length > max ? str.slice(0, max - 2) + ".." : str;
    }

    const rootElement = document.getElementById("root");
    const reactRoot = ReactDOM.createRoot(rootElement);
    reactRoot.render(<ClarionApp />);
  </script>
</body>

</html>
